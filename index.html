<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eyşan</title>
<meta name="theme-color" content="#0f1714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eyşan">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="eysan.jpg">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#0f1714;--panel:#17221e;--line:#24332d;--text:#eef4f1;--muted:#8fa69c;--accent:#3ddc97;--accent-ink:#06261a;--warn:#ffb454;--err:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
header img{width:44px;height:44px;border-radius:50%}
header h1{font-size:18px;margin:0}
header p{margin:0;color:var(--muted);font-size:13px}
header div{flex:1}
#voice{font-size:14px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 0 16px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.eysan{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.you{background:#21463a;align-self:flex-end;border-bottom-right-radius:4px}
.card{align-self:stretch;background:#13201b;border:1px solid #2d5545;border-radius:14px;padding:12px 14px;white-space:pre-wrap;font-size:15px}
.card b{color:var(--accent)}
.sys{align-self:center;color:var(--muted);font-size:13px;text-align:center}
.sys.err{color:var(--err)}
#bottom{padding:12px 0 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
#status{color:var(--muted);font-size:14px;min-height:20px}
#mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;box-shadow:0 0 0 0 rgba(61,220,151,.5);transition:transform .15s}
#mic:active{transform:scale(.96)}
#mic svg{width:40px;height:40px}
#mic.live{background:var(--err);color:#fff;animation:pulse 1.6s infinite}
#mic.busy{opacity:.6}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,107,.45)}70%{box-shadow:0 0 0 22px rgba(255,107,107,0)}100%{box-shadow:0 0 0 0 rgba(255,107,107,0)}}
#timer{color:var(--muted);font-size:12px}
#pinbox{display:none;flex-direction:column;gap:10px;align-items:center;margin:auto 0;padding:24px 0}
#pinbox input{font-size:24px;letter-spacing:6px;text-align:center;width:200px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
#pinbox button{font-size:16px;padding:12px 28px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600}
#textbar{display:flex;gap:8px;width:100%}
#txt{flex:1;min-width:0;font-size:16px;padding:12px 14px;border-radius:22px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
#textbar button{border:0;border-radius:22px;padding:0 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px}
#photoBtn{display:grid;place-items:center;width:46px;border-radius:22px;background:var(--panel);border:1px solid var(--line);font-size:20px;cursor:pointer}
.thumb{align-self:flex-end;max-width:60%;border-radius:12px;border:1px solid var(--line)}
#qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:2px 0 8px}
#qa button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:6px 4px;font-size:13px;line-height:1.2;font-weight:500}
#qa button span{font-size:20px;line-height:1}
#qa button.on{border-color:var(--accent);background:#13201b}
#qa button:active{transform:scale(.97)}
#mode{display:none;width:100%;align-items:center;gap:8px;background:#13201b;border:1px solid #2d5545;border-radius:12px;padding:8px 8px 8px 12px;font-size:14px}
#mode span{flex:1}
#mode button{background:none;border:0;color:var(--muted);font-size:18px;padding:0 6px}
#log:empty::before{content:"";width:112px;height:112px;border-radius:50%;background:url(eysan.jpg) center/cover;margin:auto auto 6px;box-shadow:0 0 0 6px rgba(61,220,151,.14)}
#log:empty::after{content:"Size nasıl yardımcı olayım, Oğuzhan Bey?";text-align:center;color:var(--muted);margin:0 auto auto;font-size:15px}
#voice{display:none!important}
#forget{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<header><img src="eysan.jpg" alt=""><div><h1>Asistanım Eyşan</h1><p>Muğla Dijital Medya</p></div><select id="voice" aria-label="Ses"><option value="marin">Ses: Marin</option><option value="coral">Ses: Coral</option><option value="shimmer">Ses: Shimmer</option><option value="sage">Ses: Sage</option><option value="cedar">Ses: Cedar (erkek)</option><option value="ash">Ses: Ash (erkek)</option></select></header>
<div id="pinbox"><p>Eyşan şifrenizi girin</p><input id="pin" type="password" inputmode="numeric" autocomplete="current-password"><button id="pinok">Giriş</button></div>
<div id="qa"><button data-q="task"><span>📝</span>Görev</button><button data-q="shoot"><span>🎥</span>Çekim</button><button data-q="todo"><span>📋</span>Yapılacak</button><button data-q="report"><span>📊</span>Rapor</button><button data-q="sharing"><span>📸</span>Paylaşım</button><button data-q="people"><span>👥</span>Ekip</button><button data-q="claude"><span>🤖</span>Claude'a iş</button><button data-q="reminder"><span>⏰</span>Hatırlat</button><button data-q="business"><span>🏢</span>İşletme</button></div>
<div id="log"></div>
<div id="bottom">
 <div id="mode"><span id="modeText"></span><button id="modeX" type="button" aria-label="Vazgeç">✕</button></div>
 <form id="textbar"><label id="photoBtn" aria-label="Fotoğraf gönder">📷<input id="photo" type="file" accept="image/*" hidden></label><input id="txt" placeholder="Yazarak da sorabilirsiniz…" autocomplete="off" enterkeyhint="send"><button>Gönder</button></form>
 <div id="status">Konuşmak için dokunun</div>
 <button id="mic" aria-label="Konuş"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg></button>
 <div id="timer"></div>
 <div style="display:flex;gap:16px"><button id="clearlog" style="background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer">Geçmişi temizle</button><button id="forget">Şifreyi unut</button></div>
</div>
<audio id="speaker" autoplay playsinline></audio>
<script>
const API='https://vxxybonajctticjoyqdi.supabase.co/functions/v1/tablo-orders/';
const $=id=>document.getElementById(id);
const log=$('log'),statusEl=$('status'),mic=$('mic'),timerEl=$('timer');
let pc=null,dc=null,stream=null,token=null,endAt=0,tick=null,busy=false,micOn=false,pendingText=null,pendingImage=null,sessionId=null,startedAt=0;
const store={get(){try{return localStorage.getItem('eysan_pin')}catch{return null}},set(v){try{localStorage.setItem('eysan_pin',v)}catch{}},del(){try{localStorage.removeItem('eysan_pin')}catch{}}};
function addRaw(cls,text){const d=document.createElement('div');d.className=cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
function hist(){try{return JSON.parse(localStorage.getItem('eysan_log')||'[]')}catch{return []}}
function keep(cls,text){if(!/^(msg|card)/.test(cls))return;try{const h=hist();h.push([cls,text]);localStorage.setItem('eysan_log',JSON.stringify(h.slice(-120)))}catch{}}
function add(cls,text){keep(cls,text);return addRaw(cls,text);}
function card(text){keep('card',text);const d=document.createElement('div');d.className='card';const b=document.createElement('b');b.textContent='Taslak';d.appendChild(b);d.appendChild(document.createTextNode('\n'+text));log.appendChild(d);log.scrollTop=log.scrollHeight;}
function setStatus(t){statusEl.textContent=t;}
function askPin(){$('pinbox').style.display='flex';log.style.display='none';$('bottom').style.display='none';$('pin').focus();}
function hidePin(){$('pinbox').style.display='none';log.style.display='flex';$('bottom').style.display='flex';}
$('pinok').onclick=()=>{const v=$('pin').value.trim();if(v.length<4)return;store.set(v);hidePin();setStatus('Konuşmak için mikrofona dokunun');};
$('pin').onkeydown=e=>{if(e.key==='Enter')$('pinok').click();};
$('forget').onclick=()=>{store.del();stop();askPin();};
const voiceSel=$('voice');try{const v=localStorage.getItem('eysan_voice');if(v)voiceSel.value=v;}catch{}
voiceSel.onchange=()=>{try{localStorage.setItem('eysan_voice',voiceSel.value)}catch{};if(pc){stop('Ses değişti, yeni sesle konuşmak için mikrofona dokunun.');}};
mic.onclick=async()=>{if(busy)return;if(conv||(pc&&micOn)){stop();return;}if(pc)stop();await start(true);};
function sendImage(u){send({type:'conversation.item.create',item:{type:'message',role:'user',content:[{type:'input_image',image_url:u},{type:'input_text',text:'Bu fotoğrafı gönderdim, bak ve ne olduğunu kısaca söyle; ne yapabileceğini öner.'}]}});send({type:'response.create'});logTurn('user','[fotoğraf gönderdi]');}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,768/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',0.72));};img.onerror=rej;img.src=URL.createObjectURL(file);});}
$('photo').onchange=async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f||busy)return;let u;try{u=await shrink(f);}catch{add('sys err','Fotoğraf açılamadı.');return;}const im=document.createElement('img');im.className='thumb';im.src=u;log.appendChild(im);log.scrollTop=log.scrollHeight;if(dc&&dc.readyState==='open')sendImage(u);else await textCall('__photo',{image:u});};
let tTok=null,tExp=0;
async function textToken(){if(tTok&&tExp>Date.now())return tTok;const pin=store.get();if(!pin){askPin();throw Error('pin');}const r=await fetch(API+'voice-session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin,textOnly:true})});const s=await r.json().catch(()=>({}));if(r.status===401){store.del();askPin();throw Error(s.error||'Şifre yanlış');}if(!r.ok)throw Error(s.error||('Hata '+r.status));tTok=s.token;tExp=Date.now()+11*3600e3;return tTok;}
function reply(x){const d=add('msg eysan',x.text);if(x.buttons&&x.buttons.length){const row=document.createElement('div');row.style.cssText='display:flex;gap:8px;margin-top:8px';for(const b of x.buttons){const bt=document.createElement('button');bt.textContent=b.text;bt.style.cssText='border:0;border-radius:10px;padding:8px 12px;font-weight:600;background:'+(b.data.startsWith('pa')?'var(--accent)':'var(--line)')+';color:'+(b.data.startsWith('pa')?'var(--accent-ink)':'var(--text)');bt.onclick=async()=>{row.remove();add('msg you',b.text);await textCall('__btn',{data:b.data});};row.appendChild(bt);}d.appendChild(row);}}
async function textCall(name,args){busy=true;setStatus('Eyşan yazıyor…');try{const t=await textToken();const r=await fetch(API+'voice-tool',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:t,name,args})});const j=await r.json().catch(()=>({}));if(r.status===401){tTok=null;throw Error('Oturum yenilendi, tekrar gönderin.');}for(const x of j.replies||[])reply(x);if(!(j.replies||[]).length)add('sys','(cevap yok)');}catch(e){if(String(e.message)!=='pin')add('sys err',String(e.message||e));}busy=false;setStatus('Konuşmak için mikrofona dokunun, yazmak için kutuyu kullanın');}
// Quick actions: tap a button, type freely; Eyşan works it out and asks "ekleyeyim mi?" like Telegram.
const QA={
 task:{t:'📝 Görev',p:'Panele görev aç (iş listesine): ',h:'ör. Ece Gizem için 3 post, Mustafa, cumaya'},
 shoot:{t:'🎥 Çekim',p:'Çekim takvimine çekim ekle (görev değil): ',h:'ör. Pablo menü çekimi perşembe 14:00, Berkay'},
 todo:{t:'📋 Yapılacak',p:'Yapılacaklar listesine ekle: ',h:'ör. Sercan faturaları kessin, yarın'},
 claude:{t:"🤖 Claude'a iş",p:"Claude'a iş olarak ilet: ",h:'ör. Müco günün menüsü videosu: mercimek, pilav'},
 reminder:{t:'⏰ Hatırlatma',p:'Hatırlatma kur: ',h:'ör. yarın 10:00 müşteriyi ara'},
 business:{t:'🏢 İşletme',p:'Yeni işletme ekle: ',h:'ör. Lezzet Durağı, restoran, @lezzetduragi'}
};
let MODE=null;
function setMode(k){MODE=k||null;document.querySelectorAll('#qa button').forEach(b=>b.classList.toggle('on',b.dataset.q===MODE));const m=$('mode');if(!MODE){m.style.display='none';$('txt').placeholder='Yazarak da sorabilirsiniz…';return;}$('modeText').textContent=QA[MODE].t+' – yazın, Eyşan ayarlasın';m.style.display='flex';$('txt').placeholder=QA[MODE].h;$('txt').focus();}
async function quick(kind){if(QA[kind])return setMode(MODE===kind?null:kind);setMode(null);const label={report:'📊 Bugünün raporu',sharing:'📸 Paylaşım kontrolü',people:'👥 Kim ne yapıyor'}[kind];add('msg you',label);await textCall('__draft',{kind});}

function sendText(t){logTurn('user',t);send({type:'conversation.item.create',item:{type:'message',role:'user',content:[{type:'input_text',text:t}]}});send({type:'response.create'});}
$('modeX').onclick=()=>setMode(null);
$('textbar').onsubmit=async e=>{e.preventDefault();const t=$('txt').value.trim();if(!t||busy)return;$('txt').value='';if(MODE){const q=QA[MODE];setMode(null);add('msg you',q.t+': '+t);await textCall('__text',{text:q.p+t});return;}add('msg you',t);if(conv){logTurn('user',t);conv.sendUserMessage(t);}else if(dc&&dc.readyState==='open')sendText(t);else await textCall('__text',{text:t});};

// ElevenLabs voice: natural Turkish voice; same tools and panel as before.
let conv=null;
function loadEleven(){if(window.ElevenLabsClient)return Promise.resolve();return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.32.1/dist/lib.iife.js';sc.onload=res;sc.onerror=()=>rej(Error('Ses kütüphanesi yüklenemedi'));document.head.appendChild(sc);});}
async function startEleven(s){
 await loadEleven();
 const tools={};
 for(const n of s.tools||[])tools[n]=async params=>{
  add('sys','🔧 '+(LABELS[n]||n)+'…');
  try{const r=await fetch(API+'voice-tool',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,name:n,args:params||{}})});const res=await r.json();if(r.status===401){setTimeout(()=>stop('Oturum süresi doldu, yeniden başlatın.'),0);return 'Oturum süresi doldu.';}if(res.onizleme)card(res.onizleme);if(n==='onayla'&&res.sonuc)add('sys',res.sonuc);return JSON.stringify(res);}
  catch(e){return JSON.stringify({hata:'Panele ulaşılamadı: '+String(e.message||e)});}
 };
 conv=await ElevenLabsClient.Conversation.startSession({
  signedUrl:s.signed_url,connectionType:'websocket',
  overrides:{agent:{prompt:{prompt:s.prompt},firstMessage:s.first_message,language:'tr'}},
  clientTools:tools,
  onMessage:m=>{const t=String(m?.message||'').trim();if(!t)return;const u=(m.role||m.source)==='user';add(u?'msg you':'msg eysan',t);logTurn(u?'user':'assistant',t);},
  onModeChange:m=>setStatus(m?.mode==='speaking'?'Eyşan konuşuyor…':'Dinliyorum…'),
  onDisconnect:()=>{if(conv){conv=null;stop('Konuşma bitti. Yeniden başlatmak için dokunun.');}},
  onError:e=>add('sys err',String(e?.message||e||'Ses hatası'))
 });
}
async function start(withMic=true){
 const pin=store.get();if(!pin){askPin();return;}
 busy=true;mic.classList.add('busy');setStatus('Bağlanıyor…');
 try{
  const r=await fetch(API+'voice-session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin,voice:voiceSel.value})});
  const s=await r.json().catch(()=>({}));
  if(r.status===401){store.del();add('sys err',s.error||'Şifre yanlış.');busy=false;mic.classList.remove('busy');askPin();return;}
  if(!r.ok)throw Error(s.error||('Hata '+r.status));
  token=s.token;sessionId=s.session_id||null;startedAt=Date.now();
  if(typeof s.left_minutes==='number')add('sys','Bugün kalan konuşma süresi: '+(s.left_minutes+Math.floor(s.minutes))+' dakika');
  if(s.provider==='eleven'){
   await startEleven(s);micOn=true;
   endAt=Date.now()+s.minutes*60e3;tick=setInterval(()=>{const left=Math.max(0,endAt-Date.now());timerEl.textContent='Kalan süre '+Math.floor(left/60e3)+':'+String(Math.floor(left/1e3)%60).padStart(2,'0');if(!left)stop('Konuşma süresi doldu. Yeniden başlatmak için dokunun.');},1000);
   mic.classList.add('live');setStatus('Dinliyorum…');busy=false;mic.classList.remove('busy');return;
  }
  pc=new RTCPeerConnection();
  pc.ontrack=e=>{$('speaker').srcObject=e.streams[0];};
  if(withMic){stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});stream.getTracks().forEach(t=>pc.addTrack(t,stream));}else pc.addTransceiver('audio',{direction:'recvonly'});
  micOn=withMic;
  dc=pc.createDataChannel('oai-events');
  dc.onmessage=e=>{try{onEvent(JSON.parse(e.data));}catch(err){console.error(err);}};
  dc.onopen=()=>{if(pendingImage){const u=pendingImage;pendingImage=null;sendImage(u);}else if(pendingText){const t=pendingText;pendingText=null;sendText(t);}else send({type:'response.create',response:{instructions:'Önce bugun_ozet aracını çağır. Sonra Oğuzhan Bey\'i saate uygun selamla (günaydın / iyi akşamlar) ve günün en önemli bir iki şeyini TEK cümleyle söyle (geciken iş, bugünkü çekim). Önemli bir şey yoksa sadece "Buyrun Oğuzhan Bey, dinliyorum" de.'}});};
  pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc?.connectionState))stop('Bağlantı koptu. Yeniden başlatmak için dokunun.');};
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);
  const a=await fetch('https://api.openai.com/v1/realtime/calls',{method:'POST',body:offer.sdp,headers:{Authorization:'Bearer '+s.key,'Content-Type':'application/sdp'}});
  if(!a.ok)throw Error('Ses bağlantısı kurulamadı ('+a.status+')');
  await pc.setRemoteDescription({type:'answer',sdp:await a.text()});
  endAt=Date.now()+s.minutes*60e3;tick=setInterval(()=>{const left=Math.max(0,endAt-Date.now());timerEl.textContent='Kalan süre '+Math.floor(left/60e3)+':'+String(Math.floor(left/1e3)%60).padStart(2,'0');if(!left)stop('Konuşma süresi doldu. Yeniden başlatmak için dokunun.');},1000);
  if(withMic){mic.classList.add('live');setStatus('Dinliyorum…');}else setStatus('Yazışma açık (mikrofon kapalı). Konuşmak için mikrofona dokunun.');
 }catch(e){add('sys err',String(e.message||e));stop();}
 busy=false;mic.classList.remove('busy');
}
function stop(note){
 clearInterval(tick);tick=null;timerEl.textContent='';
 if(sessionId&&startedAt){const body=JSON.stringify({token,name:'__end',args:{session_id:sessionId,seconds:Math.round((Date.now()-startedAt)/1000)}});try{if(!navigator.sendBeacon(API+'voice-tool',new Blob([body],{type:'text/plain'})))fetch(API+'voice-tool',{method:'POST',body,keepalive:true});}catch{}sessionId=null;startedAt=0;}
 if(conv){const c=conv;conv=null;c.endSession().catch(()=>{});}
 try{dc&&dc.close();}catch{}try{pc&&pc.close();}catch{}stream&&stream.getTracks().forEach(t=>t.stop());
 pc=dc=stream=null;micOn=false;mic.classList.remove('live');setStatus('Konuşmak için dokunun');if(note)add('sys',note);
}
function send(o){if(dc&&dc.readyState==='open')dc.send(JSON.stringify(o));}
function logTurn(role,text){if(!token||!text)return;fetch(API+'voice-tool',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,name:'__log',args:{role,text}})}).catch(()=>{});}
const LABELS={hatirla:'Hafızaya yazıyorum',claude_isi:"Claude'a iş kaydediyorum",bugun_ozet:'Bugünün özetine bakıyorum',paylasim_kontrol:'Instagram paylaşımlarına bakıyorum',panel_bilgisi:'Panele bakıyorum',taslak_cekim:'Çekim taslağı hazırlıyorum',taslak_gorev:'Görev taslağı hazırlıyorum',taslak_isletme:'İşletme taslağı hazırlıyorum',onayla:'Panele ekliyorum',vazgec:'Vazgeçiyorum'};
async function onEvent(ev){
 switch(ev.type){
  case 'input_audio_buffer.speech_started':setStatus('Dinliyorum…');break;
  case 'output_audio_buffer.started':setStatus('Eyşan konuşuyor…');break;
  case 'output_audio_buffer.stopped':setStatus('Dinliyorum…');break;
  case 'conversation.item.input_audio_transcription.completed':if(ev.transcript){add('msg you',ev.transcript.trim());logTurn('user',ev.transcript.trim());}break;
  case 'response.output_audio_transcript.done':case 'response.audio_transcript.done':if(ev.transcript){add('msg eysan',ev.transcript.trim());logTurn('assistant',ev.transcript.trim());}break;
  case 'response.done':{
   const calls=(ev.response?.output||[]).filter(o=>o.type==='function_call');
   if(!calls.length)break;
   for(const c of calls){
    add('sys','🔧 '+(LABELS[c.name]||c.name)+'…');
    let args={};try{args=JSON.parse(c.arguments||'{}');}catch{}
    let result;
    try{
     const r=await fetch(API+'voice-tool',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,name:c.name,args})});
     result=await r.json();
     if(r.status===401){stop('Oturum süresi doldu, yeniden başlatın.');return;}
    }catch(e){result={hata:'Panele ulaşılamadı: '+String(e.message||e)};}
    if(result.onizleme)card(result.onizleme);
    if(c.name==='onayla'&&result.sonuc)add('sys',result.sonuc);
    send({type:'conversation.item.create',item:{type:'function_call_output',call_id:c.call_id,output:JSON.stringify(result)}});
   }
   send({type:'response.create'});
   break;}
  case 'error':add('sys err',ev.error?.message||'Bir hata oldu');break;
 }
}
for(const [c,t] of hist()){if(c==='card'){const d=document.createElement('div');d.className='card';const b=document.createElement('b');b.textContent='Taslak';d.appendChild(b);d.appendChild(document.createTextNode('\n'+t));log.appendChild(d);}else addRaw(c,t);}log.scrollTop=log.scrollHeight;
$('clearlog').onclick=()=>{try{localStorage.removeItem('eysan_log')}catch{};log.textContent='';};
document.querySelectorAll('#qa button').forEach(b=>b.onclick=()=>{if(!busy)quick(b.dataset.q);});
window.addEventListener('pagehide',()=>{if(pc||conv)stop();});
// Leaving the app ends the call, so no minutes or credits are spent in the background.
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(pc||conv))stop('Uygulamadan çıkınca konuşma kapandı.');});
if(!store.get())askPin();
</script>
