<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eyşan</title>
<meta name="theme-color" content="#06110c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eyşan">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="eysan.jpg">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#06110c;--panel:#0d1c15;--panel2:#12261d;--line:#1d3a2c;--text:#ecfbf2;--muted:#86a897;--accent:#4ade80;--accent2:#4f8bff;--grad:linear-gradient(135deg,#4ade80 0%,#22c55e 100%);--accent-ink:#05210f;--warn:#ffb454;--err:#ff5d73;--ok:#4ade80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg)}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);background:radial-gradient(90% 45% at 50% -5%,rgba(74,222,128,.16),transparent 60%),linear-gradient(rgba(74,222,128,.045) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(74,222,128,.045) 1px,transparent 1px) 0 0/28px 28px,var(--bg);background-attachment:fixed;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 0 8px;position:relative}
header img{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 2px rgba(74,222,128,.55),0 0 18px rgba(74,222,128,.35)}
header .who{flex:1;min-width:0}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
#status{margin:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menuBtn{background:var(--panel);border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:12px;font-size:18px;line-height:1}
#menu{display:none;position:absolute;right:0;top:52px;z-index:5;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:180px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
#menu.open{display:block}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:10px 12px;border-radius:10px;font-size:15px}
#menu button:active{background:var(--line)}
#voice{display:none!important}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px 0 10px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#log:empty::before{content:"";width:96px;height:96px;border-radius:50%;background:url(eysan.jpg) center/cover;margin:auto auto 10px;box-shadow:0 0 0 3px rgba(74,222,128,.6),0 0 40px rgba(74,222,128,.45)}
#log:empty::after{content:"Size nasıl yardımcı olayım, Oğuzhan Bey?";text-align:center;color:var(--muted);margin:0 auto 18px;font-size:15px}
.msg{max-width:86%;padding:9px 13px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}
.eysan{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.you{background:var(--grad);color:#05210f;font-weight:500;align-self:flex-end;border-bottom-right-radius:6px}
.card{align-self:stretch;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.35);border-radius:16px;padding:12px 14px;white-space:pre-wrap;font-size:15px}
.card b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sys{align-self:center;color:var(--muted);font-size:12.5px;text-align:center;padding:2px 8px}
.sys.err{color:var(--err)}
.thumb{align-self:flex-end;max-width:60%;border-radius:14px;border:1px solid var(--line)}
#qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 0 10px}
#qa button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--panel);color:var(--text);border-radius:16px;padding:8px 4px;font-size:13px;font-weight:600}
#qa button span{font-size:20px;line-height:1}
#qa button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
body.chatting #qa{display:flex;overflow-x:auto;gap:6px;padding:0 0 8px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
body.chatting #qa::-webkit-scrollbar{display:none}
body.chatting #qa button{flex:0 0 auto;flex-direction:row;min-height:0;padding:7px 11px;border-radius:999px;font-size:13px;gap:5px}
body.chatting #qa button span{font-size:15px}
#bottom{display:flex;flex-direction:column;gap:8px;padding:0 0 10px}
#mode,#livebar{display:none;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px;font-size:14px}
#mode span{flex:1}
#mode button{background:none;border:0;color:var(--muted);font-size:18px;padding:0 6px}
#livebar{border-color:rgba(255,107,129,.45)}
#livebar .dot{width:9px;height:9px;border-radius:50%;background:var(--err);animation:blink 1.2s infinite}
#livebar .lt{flex:1;font-weight:600}
#timer{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
#liveStop{border:0;border-radius:10px;padding:7px 12px;background:var(--err);color:#fff;font-weight:700;font-size:13px}
body.live #livebar{display:flex}
@keyframes blink{50%{opacity:.25}}
#textbar{display:flex;gap:8px;align-items:center;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:5px}
#txt{flex:1;min-width:0;font-size:16px;padding:9px 6px;border:0;outline:0;background:transparent;color:var(--text)}
#photoBtn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;font-size:19px;cursor:pointer;flex:0 0 auto}
#mic{width:42px;height:42px;flex:0 0 auto;border-radius:50%;border:0;background:var(--panel2);color:var(--text);display:grid;place-items:center;cursor:pointer}
#mic svg{width:22px;height:22px}
#mic.live{background:var(--err);color:#fff;animation:pulse 1.6s infinite}
#mic.live.hold{background:var(--panel2);color:var(--text);animation:none;box-shadow:0 0 0 2px var(--err) inset}
#mic.busy{opacity:.55}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,129,.5)}70%{box-shadow:0 0 0 12px rgba(255,107,129,0)}100%{box-shadow:0 0 0 0 rgba(255,107,129,0)}}
#send{width:42px;height:42px;flex:0 0 auto;border:0;border-radius:50%;background:var(--grad);color:#05210f;display:grid;place-items:center}
#send svg{width:20px;height:20px}
#orb{display:none;position:fixed;inset:0;z-index:20;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 26px);background:radial-gradient(60% 40% at 50% 42%,rgba(74,222,128,.16),transparent 70%),linear-gradient(rgba(74,222,128,.07) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(74,222,128,.07) 1px,transparent 1px) 0 0/28px 28px,#06110c}
body.orbOn:not(.orbHide) #orb{display:flex}
.pill{display:flex;padding:5px;border-radius:999px;border:1px solid rgba(124,240,168,.35);background:rgba(10,30,20,.75);box-shadow:0 0 28px rgba(74,222,128,.22)}
.pill span{padding:10px 26px;border-radius:999px;font-weight:700;font-size:17px;color:#5f8a73;transition:all .25s}
.pill span.on{background:#4ade80;color:#05210f;box-shadow:0 0 26px rgba(74,222,128,.6)}
#orbWrap{position:relative;flex:1;width:100%;min-height:0;display:grid;place-items:center}
#orbWrap::before{content:"";position:absolute;width:min(78vw,60vh);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(74,222,128,.45);box-shadow:0 0 30px rgba(74,222,128,.18),inset 0 0 30px rgba(74,222,128,.08)}
#orbCanvas{width:100%;height:100%;display:block}
#orbText{font-size:21px;font-weight:700;text-align:center;line-height:1.35;max-width:94%;min-height:2.7em;color:#fff;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#orbText.ai{color:#7cf0a8}
#orbStatus{color:#86a897;font-size:14px;margin:8px 0 18px;text-align:center}
.orbBtns{display:flex;gap:16px;align-items:center}
.orbBtns button{border-radius:999px;height:62px;min-width:62px;font-size:22px;background:rgba(124,240,168,.10);color:#e9fff1;border:1px solid rgba(124,240,168,.35);display:grid;place-items:center}
.orbBtns svg{width:26px;height:26px}
#orbMic.on{background:#4ade80;color:#05210f;animation:orbp 1.6s infinite}
#orbEnd{background:#ff5d73;border-color:#ff5d73;font-size:16px;font-weight:700;padding:0 28px}
@keyframes orbp{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}70%{box-shadow:0 0 0 18px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
#orbBack{position:absolute;left:14px;top:calc(env(safe-area-inset-top) + 14px);width:46px;height:46px;border-radius:14px;border:1px solid rgba(124,240,168,.35);background:rgba(10,30,20,.75);color:#e9fff1;font-size:30px;line-height:1;z-index:2;display:grid;place-items:center;padding:0 0 4px}
#pinbox{display:none;flex-direction:column;gap:12px;align-items:center;margin:auto 0;padding:24px 0}
#pinbox p{color:var(--muted);margin:0}
#pinbox input{font-size:24px;letter-spacing:6px;text-align:center;width:210px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
#pinbox button{font-size:16px;padding:12px 32px;border-radius:14px;border:0;background:var(--grad);color:#fff;font-weight:700}
#dash{display:none;position:fixed;inset:0;z-index:14;overflow-y:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(90% 40% at 50% -5%,rgba(74,222,128,.14),transparent 60%),linear-gradient(rgba(74,222,128,.04) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(74,222,128,.04) 1px,transparent 1px) 0 0/28px 28px,var(--bg)}
body.dashOn #dash{display:block}
#dash .dw{max-width:1280px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 96px)}
#dash .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
#dash .top img{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 2px rgba(74,222,128,.55)}
#dash .top h1{margin:0;font-size:19px}#dash .top p{margin:0;color:var(--muted);font-size:13px}
#dash .sp{flex:1}
#dash .chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:8px 12px;font-size:13.5px;cursor:pointer}
#dash .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
#dash .kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 16px;position:relative;overflow:hidden;text-align:left;color:var(--text);font:inherit;cursor:pointer}
#dash .kpi b{font-size:28px;display:block;line-height:1.1}#dash .kpi span{color:var(--muted);font-size:12.5px}
#dash .kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#4ade80}
#dash .kpi.r::after{background:#ff5d73}#dash .kpi.o::after{background:#ffb454}#dash .kpi.b::after{background:#4f8bff}
#dash .kpi.r b{color:#ff8a9a}#dash .kpi.o b{color:#ffc77a}
#dash .grid{display:grid;grid-template-columns:1fr 1.2fr 1.5fr;gap:14px;align-items:start}
#dash .dcard{background:rgba(13,28,21,.92);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
#dash .dcard h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
#dash .dcard h2 small{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px}
#dash .ev{display:flex;gap:12px;padding:9px 6px;border-top:1px solid #16301f}
#dash .ev:first-of-type{border-top:0}
#dash .ev time{width:46px;flex:0 0 auto;color:#7cf0a8;font-weight:700;font-variant-numeric:tabular-nums}
#dash .ev .t{min-width:0}#dash .ev .t b{display:block;font-size:14px;font-weight:600}#dash .ev .t span{color:var(--muted);font-size:12.5px}
#dash .ev .ic{margin-left:auto;font-size:16px}
#dash .ev.past{opacity:.5}
#dash .ev.next{background:linear-gradient(90deg,rgba(74,222,128,.13),transparent);border-radius:10px}
#dash .ev.next time{color:#fff}
#dash .empty{color:var(--muted);font-size:13.5px;padding:6px 2px}
#dash .pp{display:grid;grid-template-columns:96px 1fr 30px;align-items:center;gap:10px;padding:6px 0}
#dash .pp .n{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#dash .pp .c{text-align:right;font-weight:700;font-size:13.5px}
#dash .bar{height:10px;border-radius:999px;background:#12261d;overflow:hidden;display:flex;min-width:8px}
#dash .bar i{display:block;height:100%}#dash .bar .l{background:#ff5d73}#dash .bar .t{background:#ffb454}#dash .bar .o{background:#4ade80}
#dash .legend{display:flex;gap:12px;color:var(--muted);font-size:11.5px;margin:2px 0 6px}#dash .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
#dash .sub{margin-top:10px;border-top:1px solid #16301f;padding-top:8px}
#dash .sub h3{font-size:13.5px;margin:0 0 4px}
#dash .li{display:flex;gap:8px;padding:6px 0;font-size:13.5px}#dash .li .d{color:#ff8a9a;font-weight:700;width:46px;flex:0 0 auto}#dash .li .d.o{color:#ffc77a}#dash .li span{color:var(--muted)}
#dash .filt{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
#dash .filt button{border:1px solid var(--line);background:#0f2219;color:var(--muted);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
#dash .filt button.on{background:#4ade80;color:#05210f;border-color:#4ade80;font-weight:700}
#dash .biz{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#dash .bz{background:#0f2219;border:1px solid var(--line);border-radius:14px;padding:10px 12px;position:relative;text-align:left;color:var(--text);font:inherit;cursor:pointer;display:flex;gap:10px;align-items:flex-start;min-width:0}
#dash .bz img,#dash .bz .ph{width:38px;height:38px;border-radius:50%;flex:0 0 auto;object-fit:cover;background:#12261d;display:grid;place-items:center;font-size:16px}
#dash .bz .in{min-width:0;flex:1}
#dash .bz b{font-size:13.5px;display:block;padding-right:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dash .bz span{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dash .bz .dot{position:absolute;top:12px;right:10px;width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
#dash .bz.y .dot{background:#ffb454;box-shadow:0 0 8px #ffb454}#dash .bz.r .dot{background:#ff5d73;box-shadow:0 0 8px #ff5d73}#dash .bz.n .dot{background:#4b5f55;box-shadow:none}
#dash .bz.r{border-color:rgba(255,93,115,.4)}
#dash .tg{display:inline-block!important;margin:5px 4px 0 0;font-size:11px!important;background:#12261d;border-radius:999px;padding:1px 8px;color:#cfeedd!important}
#dash .tg.r{background:rgba(255,93,115,.18);color:#ff9aa8!important}
#dash .up{color:#7cf0a8}#dash .down{color:#ff8a9a}
#dash .tabs{display:none}
#dashFab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:15;display:none;align-items:center;gap:10px;background:linear-gradient(135deg,#4ade80,#22c55e);color:#05210f;border:0;border-radius:999px;padding:8px 18px 8px 8px;font-weight:800;font-size:15px;box-shadow:0 10px 30px rgba(74,222,128,.35);cursor:pointer}
body.dashOn #dashFab{display:flex}
#dashFab img{width:36px;height:36px;border-radius:50%}
#dashBtn{background:var(--panel);border:1px solid var(--line);color:var(--text);height:36px;border-radius:12px;font-size:14px;padding:0 10px;margin-left:auto}
#bizSheet{display:none;position:fixed;inset:0;z-index:16;background:rgba(0,0,0,.6);align-items:flex-end;justify-content:center}
body.bizOn #bizSheet{display:flex}
#bizSheet .bx{background:var(--bg);width:100%;max-width:760px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;border-top:1px solid rgba(74,222,128,.35);padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
#bizSheet .bh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
#bizSheet .bh img,#bizSheet .bh .ph{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#12261d;display:grid;place-items:center;font-size:24px}
#bizSheet .bh h3{margin:0;font-size:18px}#bizSheet .bh p{margin:2px 0 0;color:var(--muted);font-size:13px}#bizSheet .bh a{color:var(--accent)}
#bizSheet .bh button{margin-left:auto;background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer}
#bizSheet .st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
#bizSheet .st div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
#bizSheet .st b{display:block;font-size:18px}#bizSheet .st span{color:var(--muted);font-size:11.5px}
#bizSheet .sec{margin:14px 0 6px;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
#bizSheet svg{width:100%;height:90px;display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px}
#bizSheet .note{color:var(--muted);font-size:13px;background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
#bizSheet .posts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#bizSheet .po{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#12261d;display:block}
#bizSheet .po img{width:100%;height:100%;object-fit:cover;display:block}
#bizSheet .po span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));display:flex;justify-content:space-between}
#bizSheet .po i{position:absolute;top:4px;right:6px;font-style:normal;font-size:12px}
#bizSheet .tk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:6px;font-size:14px}
#bizSheet .tk small{display:block;color:var(--muted);font-size:12px}
#bizSheet .tk.late{border-color:rgba(255,93,115,.5)}
@media (max-width:900px){
 #dash .dw{padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 96px)}
 #dash .kpis{grid-template-columns:repeat(3,1fr);gap:8px}
 #dash .kpi{padding:9px 10px 9px 13px;border-radius:14px}#dash .kpi b{font-size:22px}#dash .kpi span{font-size:11.5px}
 #dash .tabs{display:flex;gap:6px;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;position:sticky;top:0;z-index:2}
 #dash .tabs button{flex:1;border:0;background:none;color:var(--muted);padding:9px 0;border-radius:10px;font-weight:700;font-size:13.5px}
 #dash .tabs button.on{background:#4ade80;color:#05210f}
 #dash .grid{grid-template-columns:1fr}
 #dash .grid>.dcard:not(.show){display:none}
 #dash .top .chip.hm{display:none}
 #bizSheet .posts{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:420px){#dash .biz{grid-template-columns:1fr}#bizSheet .st{grid-template-columns:repeat(2,1fr)}}
</style>
<body>
<header><img src="eysan.jpg" alt=""><div class="who"><h1>Eyşan</h1><p id="status">Çevrimiçi</p></div><select id="voice" aria-label="Ses"><option value="marin">marin</option></select><button id="dashBtn" type="button">📊 Panel</button><button id="menuBtn" type="button" aria-label="Menü">⋯</button>
<div id="menu"><button id="whoBtn" type="button">👤 Kullanan: Oğuzhan</button><button id="clearlog" type="button">🧹 Geçmişi temizle</button><button id="forget" type="button">🔒 Şifreyi unut</button></div></header>
<div id="pinbox"><p>Eyşan şifrenizi girin</p><input id="pin" type="password" inputmode="numeric" autocomplete="current-password"><button id="pinok">Giriş</button></div>
<div id="log"></div>

<script>
const API='https://vxxybonajctticjoyqdi.supabase.co/functions/v1/tablo-orders/';
const $=id=>document.getElementById(id);
const log=$('log'),statusEl=$('status'),mic=$('mic'),timerEl=$('timer');
let pc=null,dc=null,stream=null,token=null,endAt=0,tick=null,busy=false,micOn=false,pendingText=null,pendingImage=null,sessionId=null,startedAt=0;
const store={get(){try{return localStorage.getItem('eysan_pin')}catch{return null}},set(v){try{localStorage.setItem('eysan_pin',v)}catch{}},del(){try{localStorage.removeItem('eysan_pin')}catch{}}};
function addRaw(cls,text){const d=document.createElement('div');d.className=cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
function hist(){try{return JSON.parse(localStorage.getItem('eysan_log')||'[]')}catch{return []}}
function keep(cls,text){if(!/^(msg|card)/.test(cls))return;try{const h=hist();h.push([cls,text]);localStorage.setItem('eysan_log',JSON.stringify(h.slice(-120)))}catch{}}
function add(cls,text){keep(cls,text);return addRaw(cls,text);}
function card(text){keep('card',text);const d=document.createElement('div');d.className='card';const b=document.createElement('b');b.textContent='Taslak';d.appendChild(b);d.appendChild(document.createTextNode('\n'+text));log.appendChild(d);log.scrollTop=log.scrollHeight;}
function setStatus(t){statusEl.textContent=t.replace(/^Konuşmak için.*$/,'Çevrimiçi');const o=document.getElementById('orbStatus');if(o)o.textContent=t;orbWho();}
function orbWho(){try{const ai=agentTalking,you=!ai&&!micMuted&&mic.classList.contains('live');const a=document.getElementById('pillAi'),y=document.getElementById('pillYou'),m=document.getElementById('orbMic');if(!a)return;a.classList.toggle('on',ai);y.classList.toggle('on',you);m.classList.toggle('on',you);}catch{}}
function askPin(){$('pinbox').style.display='flex';log.style.display='none';$('bottom').style.display='none';$('qa').style.display='none';$('pin').focus();}
function hidePin(){$('pinbox').style.display='none';log.style.display='flex';$('bottom').style.display='flex';$('qa').style.display='';}
$('pinok').onclick=()=>{const v=$('pin').value.trim();if(v.length<4)return;store.set(v);hidePin();setStatus('Konuşmak için mikrofona dokunun');};
$('pin').onkeydown=e=>{if(e.key==='Enter')$('pinok').click();};
$('forget').onclick=()=>{store.del();stop();askPin();};
const voiceSel=$('voice');try{const v=localStorage.getItem('eysan_voice');if(v)voiceSel.value=v;}catch{}
voiceSel.onchange=()=>{try{localStorage.setItem('eysan_voice',voiceSel.value)}catch{};if(pc){stop('Ses değişti, yeni sesle konuşmak için mikrofona dokunun.');}};
mic.onclick=async()=>{if(busy)return;if(conv){muteMic(!micMuted);return;}if(pc&&micOn){stop();return;}if(pc)stop();await start(true);};
function sendImage(u){send({type:'conversation.item.create',item:{type:'message',role:'user',content:[{type:'input_image',image_url:u},{type:'input_text',text:'Bu fotoğrafı gönderdim, bak ve ne olduğunu kısaca söyle; ne yapabileceğini öner.'}]}});send({type:'response.create'});logTurn('user','[fotoğraf gönderdi]');}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,768/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',0.72));};img.onerror=rej;img.src=URL.createObjectURL(file);});}
$('photo').onchange=async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f||busy)return;let u;try{u=await shrink(f);}catch{add('sys err','Fotoğraf açılamadı.');return;}const im=document.createElement('img');im.className='thumb';im.src=u;log.appendChild(im);log.scrollTop=log.scrollHeight;if(dc&&dc.readyState==='open')sendImage(u);else await textCall('__photo',{image:u});};
let tTok=null,tExp=0;
async function textToken(){if(tTok&&tExp>Date.now())return tTok;const pin=store.get();if(!pin){askPin();throw Error('pin');}const r=await fetch(API+'voice-session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin,textOnly:true})});const s=await r.json().catch(()=>({}));if(r.status===401){store.del();askPin();throw Error(s.error||'Şifre yanlış');}if(!r.ok)throw Error(s.error||('Hata '+r.status));tTok=s.token;tExp=Date.now()+11*3600e3;return tTok;}
function reply(x){const d=add('msg eysan',x.text);if(x.buttons&&x.buttons.length){const row=document.createElement('div');row.style.cssText='display:flex;gap:8px;margin-top:8px';for(const b of x.buttons){const bt=document.createElement('button');bt.textContent=b.text;bt.style.cssText='border:0;border-radius:10px;padding:8px 12px;font-weight:600;background:'+(b.data.startsWith('pa')?'var(--accent)':'var(--line)')+';color:'+(b.data.startsWith('pa')?'var(--accent-ink)':'var(--text)');bt.onclick=async()=>{row.remove();add('msg you',b.text);await textCall('__btn',{data:b.data});};row.appendChild(bt);}d.appendChild(row);}}
async function textCall(name,args){busy=true;setStatus('Eyşan yazıyor…');try{const t=await textToken();const r=await fetch(API+'voice-tool',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:t,name,args})});const j=await r.json().catch(()=>({}));if(r.status===401){tTok=null;throw Error('Oturum yenilendi, tekrar gönderin.');}for(const x of j.replies||[])reply(x);if(!(j.replies||[]).length)add('sys','(cevap yok)');}catch(e){if(String(e.message)!=='pin')add('sys err',String(e.message||e));}busy=false;setStatus('Konuşmak için mikrofona dokunun, yazmak için kutuyu kullanın');}
// Quick actions: tap a button, type freely; Eyşan works it out and asks "ekleyeyim mi?" like Telegram.
const QA={
 task:{t:'📝 Görev',p:'Panele görev aç (iş listesine): ',h:'ör. Ece Gizem için 3 post, Mustafa, cumaya'},
 shoot:{t:'🎥 Çekim',p:'Çekim takvimine çekim ekle (görev değil): ',h:'ör. Pablo menü çekimi perşembe 14:00, Berkay'},
 todo:{t:'📋 Yapılacak',p:'Yapılacaklar listesine ekle: ',h:'ör. Sercan faturaları kessin, yarın'},
 claude:{t:"🤖 Claude'a iş",p:"Claude'a iş olarak ilet: ",h:'ör. Müco günün menüsü videosu: mercimek, pilav'},
 reminder:{t:'⏰ Hatırlatma',p:'Hatırlatma kur: ',h:'ör. yarın 10:00 müşteriyi ara'},
 business:{t:'🏢 İşletme',p:'Yeni işletme ekle: ',h:'ör. Lezzet Durağı, restoran, @lezzetduragi'}
};
let MODE=null;
function setMode(k){MODE=k||null;document.querySelectorAll('#qa button').forEach(b=>b.classList.toggle('on',b.dataset.q===MODE));const m=$('mode');if(!MODE){m.style.display='none';$('txt').placeholder='Eyşan\'a yazın…';return;}$('modeText').textContent=QA[MODE].t+' – yazın, Eyşan ayarlasın';m.style.display='flex';$('txt').placeholder=QA[MODE].h;$('txt').focus();}
async function quick(kind){if(QA[kind])return setMode(MODE===kind?null:kind);setMode(null);const label={report:'📊 Kiraz, eksik kalan işler neler?',sharing:'📸 Defne, paylaşım yapılmayan işletmeler hangileri?',people:'👥 Kim ne yapıyor'}[kind];add('msg you',label);await textCall('__draft',{kind});}

function sendText(t){logTurn('user',t);send({type:'conversation.item.create',item:{type:'message',role:'user',content:[{type:'input_text',text:t}]}});send({type:'response.create'});}
$('modeX').onclick=()=>setMode(null);
$('textbar').onsubmit=async e=>{e.preventDefault();const t=$('txt').value.trim();if(!t||busy)return;$('txt').value='';if(MODE){const q=QA[MODE];setMode(null);add('msg you',q.t+': '+t);await textCall('__text',{text:q.p+t,who:WHO()});return;}add('msg you',t);if(conv){logTurn('user',t);conv.sendUserMessage(t);}else if(dc&&dc.readyState==='open')sendText(t);else await textCall('__text',{text:t,who:WHO()});};

// ElevenLabs voice: natural Turkish voice; same tools and panel as before.
// Push-to-talk: the mic is muted until Oğuzhan Bey taps it, and mutes again when Eyşan answers, so background voices are not heard.
// Mic opens by itself whenever Eyşan finishes talking; it is closed while she speaks (so she doesn't hear herself or the room),
// and a tap closes it to say "I'm done" when background voices would keep the turn open.
let conv=null,micMuted=false,agentTalking=false;
function muteMic(on){if(!conv)return;try{conv.setMicMuted(on);}catch{}micMuted=on;mic.classList.toggle('hold',on);setStatus(on?'🎙️ Konuşmak için mikrofona dokunun':'🔴 Dinliyorum, bitince mikrofona tekrar dokunun');$('livebar').querySelector('.lt').textContent=on?'Sesli konuşma açık':'Konuşun, bitince 🎙️ dokunun';}
function loadEleven(){if(window.ElevenLabsClient)return Promise.resolve();return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.32.1/dist/lib.iife.js';sc.onload=res;sc.onerror=()=>rej(Error('Ses kütüphanesi yüklenemedi'));document.head.appendChild(sc);});}
async function startEleven(s){
 await loadEleven();
 const tools={};
 for(const n of s.tools||[])tools[n]=async params=>{
  add('sys','🔧 '+(LABELS[n]||n)+'…');
  try{const r=await fetch(API+'voice-tool',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,name:n,args:params||{}})});const res=await r.json();if(r.status===401){setTimeout(()=>stop('Oturum süresi doldu, yeniden başlatın.'),0);return 'Oturum süresi doldu.';}if(res.onizleme)card(res.onizleme);if(n==='onayla'&&res.sonuc)add('sys',res.sonuc);return JSON.stringify(res);}
  catch(e){return JSON.stringify({hata:'Panele ulaşılamadı: '+String(e.message||e)});}
 };
 conv=await ElevenLabsClient.Conversation.startSession({
  signedUrl:s.signed_url,connectionType:'websocket',
  overrides:{agent:{prompt:{prompt:s.prompt},firstMessage:s.first_message,language:'tr'}},
  clientTools:tools,
  onMessage:m=>{const t=String(m?.message||'').trim();if(!t||/^[.…\s]*$/.test(t))return;const u=(m.role||m.source)==='user';{const o=$('orbText');o.textContent=t.length>220?t.slice(0,217)+'…':t;o.classList.toggle('ai',!u);}add(u?'msg you':'msg eysan',t);logTurn(u?'user':'assistant',t);},
  onModeChange:m=>{if(m?.mode==='speaking'){agentTalking=true;if(conv&&!micMuted)muteMic(true);setStatus('Eyşan konuşuyor…');}else if(agentTalking){agentTalking=false;muteMic(false);}else setStatus(micMuted?'🎙️ Konuşmak için mikrofona dokunun':'🔴 Dinliyorum, bitince mikrofona tekrar dokunun');},
  onDisconnect:()=>{if(conv){conv=null;stop('Konuşma bitti. Yeniden başlatmak için dokunun.');}},
  onError:e=>add('sys err',String(e?.message||e||'Ses hatası'))
 });
}
async function start(withMic=true){
 const pin=store.get();if(!pin){askPin();return;}
 busy=true;mic.classList.add('busy');setStatus('Bağlanıyor…');
 try{
  const r=await fetch(API+'voice-session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin,voice:voiceSel.value,who:WHO()})});
  const s=await r.json().catch(()=>({}));
  if(r.status===401){store.del();add('sys err',s.error||'Şifre yanlış.');busy=false;mic.classList.remove('busy');askPin();return;}
  if(!r.ok)throw Error(s.error||('Hata '+r.status));
  token=s.token;sessionId=s.session_id||null;startedAt=Date.now();
  if(typeof s.left_minutes==='number')add('sys','Bugün kalan konuşma süresi: '+(s.left_minutes+Math.floor(s.minutes))+' dakika');
  if(s.provider==='eleven'){
   await startEleven(s);micOn=true;
   endAt=Date.now()+s.minutes*60e3;tick=setInterval(()=>{const left=Math.max(0,endAt-Date.now());timerEl.textContent='Kalan süre '+Math.floor(left/60e3)+':'+String(Math.floor(left/1e3)%60).padStart(2,'0');if(!left)stop('Konuşma süresi doldu. Yeniden başlatmak için dokunun.');},1000);
   mic.classList.add('live');muteMic(false);busy=false;mic.classList.remove('busy');return;
  }
  pc=new RTCPeerConnection();
  pc.ontrack=e=>{$('speaker').srcObject=e.streams[0];};
  if(withMic){stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});stream.getTracks().forEach(t=>pc.addTrack(t,stream));}else pc.addTransceiver('audio',{direction:'recvonly'});
  micOn=withMic;
  dc=pc.createDataChannel('oai-events');
  dc.onmessage=e=>{try{onEvent(JSON.parse(e.data));}catch(err){console.error(err);}};
  dc.onopen=()=>{if(pendingImage){const u=pendingImage;pendingImage=null;sendImage(u);}else if(pendingText){const t=pendingText;pendingText=null;sendText(t);}else send({type:'response.create',response:{instructions:'Önce bugun_ozet aracını çağır. Sonra Oğuzhan Bey\'i saate uygun selamla (günaydın / iyi akşamlar) ve günün en önemli bir iki şeyini TEK cümleyle söyle (geciken iş, bugünkü çekim). Önemli bir şey yoksa sadece "Buyrun Oğuzhan Bey, dinliyorum" de.'}});};
  pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc?.connectionState))stop('Bağlantı koptu. Yeniden başlatmak için dokunun.');};
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);
  const a=await fetch('https://api.openai.com/v1/realtime/calls',{method:'POST',body:offer.sdp,headers:{Authorization:'Bearer '+s.key,'Content-Type':'application/sdp'}});
  if(!a.ok)throw Error('Ses bağlantısı kurulamadı ('+a.status+')');
  await pc.setRemoteDescription({type:'answer',sdp:await a.text()});
  endAt=Date.now()+s.minutes*60e3;tick=setInterval(()=>{const left=Math.max(0,endAt-Date.now());timerEl.textContent='Kalan süre '+Math.floor(left/60e3)+':'+String(Math.floor(left/1e3)%60).padStart(2,'0');if(!left)stop('Konuşma süresi doldu. Yeniden başlatmak için dokunun.');},1000);
  if(withMic){mic.classList.add('live');setStatus('Dinliyorum…');}else setStatus('Yazışma açık (mikrofon kapalı). Konuşmak için mikrofona dokunun.');
 }catch(e){add('sys err',String(e.message||e));stop();}
 busy=false;mic.classList.remove('busy');
}
function stop(note){
 clearInterval(tick);tick=null;timerEl.textContent='';
 if(sessionId&&startedAt){const body=JSON.stringify({token,name:'__end',args:{session_id:sessionId,seconds:Math.round((Date.now()-startedAt)/1000)}});try{if(!navigator.sendBeacon(API+'voice-tool',new Blob([body],{type:'text/plain'})))fetch(API+'voice-tool',{method:'POST',body,keepalive:true});}catch{}sessionId=null;startedAt=0;}
 if(conv){const c=conv;conv=null;c.endSession().catch(()=>{});}
 micMuted=false;agentTalking=false;mic.classList.remove('hold');
 try{dc&&dc.close();}catch{}try{pc&&pc.close();}catch{}stream&&stream.getTracks().forEach(t=>t.stop());
 pc=dc=stream=null;micOn=false;mic.classList.remove('live');setStatus('Konuşmak için dokunun');if(note)add('sys',note);
}
function send(o){if(dc&&dc.readyState==='open')dc.send(JSON.stringify(o));}
function logTurn(role,text){if(!token||!text)return;fetch(API+'voice-tool',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,name:'__log',args:{role,text}})}).catch(()=>{});}
const LABELS={hatirla:'Hafızaya yazıyorum',claude_isi:"Claude'a iş kaydediyorum",bugun_ozet:'Bugünün özetine bakıyorum',paylasim_kontrol:'Instagram paylaşımlarına bakıyorum',panel_bilgisi:'Panele bakıyorum',taslak_cekim:'Çekim taslağı hazırlıyorum',taslak_gorev:'Görev taslağı hazırlıyorum',taslak_isletme:'İşletme taslağı hazırlıyorum',onayla:'Panele ekliyorum',vazgec:'Vazgeçiyorum'};
async function onEvent(ev){
 switch(ev.type){
  case 'input_audio_buffer.speech_started':setStatus('Dinliyorum…');break;
  case 'output_audio_buffer.started':setStatus('Eyşan konuşuyor…');break;
  case 'output_audio_buffer.stopped':setStatus('Dinliyorum…');break;
  case 'conversation.item.input_audio_transcription.completed':if(ev.transcript){add('msg you',ev.transcript.trim());logTurn('user',ev.transcript.trim());}break;
  case 'response.output_audio_transcript.done':case 'response.audio_transcript.done':if(ev.transcript){add('msg eysan',ev.transcript.trim());logTurn('assistant',ev.transcript.trim());}break;
  case 'response.done':{
   const calls=(ev.response?.output||[]).filter(o=>o.type==='function_call');
   if(!calls.length)break;
   for(const c of calls){
    add('sys','🔧 '+(LABELS[c.name]||c.name)+'…');
    let args={};try{args=JSON.parse(c.arguments||'{}');}catch{}
    let result;
    try{
     const r=await fetch(API+'voice-tool',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,name:c.name,args})});
     result=await r.json();
     if(r.status===401){stop('Oturum süresi doldu, yeniden başlatın.');return;}
    }catch(e){result={hata:'Panele ulaşılamadı: '+String(e.message||e)};}
    if(result.onizleme)card(result.onizleme);
    if(c.name==='onayla'&&result.sonuc)add('sys',result.sonuc);
    send({type:'conversation.item.create',item:{type:'function_call_output',call_id:c.call_id,output:JSON.stringify(result)}});
   }
   send({type:'response.create'});
   break;}
  case 'error':add('sys err',ev.error?.message||'Bir hata oldu');break;
 }
}
for(const [c,t] of hist()){if(c==='card'){const d=document.createElement('div');d.className='card';const b=document.createElement('b');b.textContent='Taslak';d.appendChild(b);d.appendChild(document.createTextNode('\n'+t));log.appendChild(d);}else addRaw(c,t);}log.scrollTop=log.scrollHeight;
$('clearlog').onclick=()=>{try{localStorage.removeItem('eysan_log')}catch{};log.textContent='';$('menu').classList.remove('open');};
document.querySelectorAll('#qa button').forEach(b=>b.onclick=()=>{if(!busy)quick(b.dataset.q);});
// Who uses this phone: the owner (default) or Berkay; Eyşan greets and addresses them by name.
function WHO(){try{return localStorage.getItem('eysan_who')==='berkay'?'berkay':'oguzhan'}catch{return 'oguzhan'}}
function showWho(){$('whoBtn').textContent='👤 Kullanan: '+(WHO()==='berkay'?'Berkay':'Oğuzhan')+' (değiştir)';}
$('whoBtn').onclick=e=>{e.stopPropagation();try{localStorage.setItem('eysan_who',WHO()==='berkay'?'oguzhan':'berkay')}catch{};showWho();if(pc||conv)stop('Kullanıcı değişti, mikrofona yeniden dokunun.');};showWho();
// Voice screen: a dotted sphere that breathes with Eyşan's voice (and yours while you talk).
const ORB={raf:0,pts:[],t:0,v:0};
function orbInit(){if(ORB.pts.length)return;const N=560;for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),th=i*2.399963;ORB.pts.push([Math.cos(th)*r,y,Math.sin(th)*r,Math.random()<.13]);}}
function orbLoop(){const c=$('orbCanvas');const g=c.getContext('2d');const dpr=window.devicePixelRatio||1;const w=c.clientWidth,h=c.clientHeight;if(!w||!h){ORB.raf=requestAnimationFrame(orbLoop);return;}if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);}g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
 let vol=0;try{if(conv)vol=agentTalking?conv.getOutputVolume():(micMuted?0:conv.getInputVolume());}catch{}
 ORB.v=ORB.v*.82+Math.min(1,vol*3)*.18;ORB.t+=.005+ORB.v*.02;
 const R=Math.min(w,h)*.34*(1+ORB.v*.16),cx=w/2,cy=h/2,ca=Math.cos(ORB.t),sa=Math.sin(ORB.t),cb=Math.cos(.4),sb=Math.sin(.4);
 for(const [x,y,z,b] of ORB.pts){let X=x*ca+z*sa,Z=-x*sa+z*ca;const Y=y*cb-Z*sb;Z=y*sb+Z*cb;const n=1+ORB.v*.22*Math.sin(ORB.t*7+x*5+y*6)+.015*Math.sin(ORB.t*2+y*4);const d=(Z+1)/2;g.globalAlpha=.18+d*.82;g.fillStyle=b?'#4f8bff':'#7cf0a8';g.beginPath();g.arc(cx+X*R*n,cy+Y*R*n,.7+d*2.8*(1+ORB.v*.7),0,6.2832);g.fill();}
 g.globalAlpha=1;ORB.raf=requestAnimationFrame(orbLoop);}
function orbShow(on){const was=document.body.classList.contains('orbOn');document.body.classList.toggle('orbOn',on);if(on&&!was){document.body.classList.remove('orbHide');$('orbText').textContent='';orbInit();cancelAnimationFrame(ORB.raf);ORB.raf=requestAnimationFrame(orbLoop);}if(!on){cancelAnimationFrame(ORB.raf);}orbWho();}
new MutationObserver(()=>orbShow(mic.classList.contains('live'))).observe(mic,{attributes:true,attributeFilter:['class']});
$('orbMic').onclick=()=>mic.click();$('orbEnd').onclick=()=>stop();
$('orbChat').onclick=()=>document.body.classList.add('orbHide');
// Back arrow on the voice screen: end the call and return to the panel.
$('orbBack').onclick=()=>{try{stop();}catch{}document.body.classList.remove('orbOn','orbHide');dashShow(true);};
$('livebar').onclick=e=>{if(e.target.id!=='liveStop')document.body.classList.remove('orbHide');};
const syncChat=()=>document.body.classList.toggle('chatting',log.children.length>0);new MutationObserver(syncChat).observe(log,{childList:true});syncChat();
new MutationObserver(()=>document.body.classList.toggle('live',mic.classList.contains('live'))).observe(mic,{attributes:true,attributeFilter:['class']});
$('liveStop').onclick=()=>stop();
$('menuBtn').onclick=e=>{e.stopPropagation();$('menu').classList.toggle('open');};document.addEventListener('click',()=>$('menu').classList.remove('open'));
window.addEventListener('pagehide',()=>{if(pc||conv)stop();});
// Leaving the app ends the call, so no minutes or credits are spent in the background.
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(pc||conv))stop('Uygulamadan çıkınca konuşma kapandı.');});
if(!store.get())askPin();

// 📊 Panel: today's agenda, work by person, and every business with its Instagram numbers.
const DZ={data:null,at:0,filter:'all',tab:0};
const dEsc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dDay=ts=>new Date(ts).toLocaleDateString('sv-SE',{timeZone:'Europe/Istanbul'});
const dHM=ts=>new Date(ts).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Istanbul'});
const dNum=n=>n==null?'—':Number(n).toLocaleString('tr-TR');
const dDays=ts=>ts?Math.round((Date.parse(dDay(Date.now()))-Date.parse(dDay(ts)))/86400e3):null;
const dAgo=ts=>{const d=dDays(ts);return d==null?'paylaşım yok':d<=0?'bugün':d===1?'dün':d+' gün önce';};
const dShortDate=s=>s?s.slice(8,10)+'.'+s.slice(5,7):'';
const dName=n=>String(n||'—').replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toLocaleUpperCase('tr-TR'));
function dState(b){if(b.ads)return 'n';if(!b.ig)return 'n';const d=dDays(b.ig.last);return d==null||d>7?'r':d>3?'y':'g';}
async function dCall(name,args){const t=await textToken();const r=await fetch(API+'voice-tool',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:t,name,args})});if(r.status===401){tTok=null;throw Error('Oturum yenilendi, tekrar deneyin.');}const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||('Hata '+r.status));return j;}
function dashShow(on){document.body.classList.toggle('dashOn',on);if(on&&Date.now()-DZ.at>60e3)loadDash();}
async function loadDash(){
 $('dDate').textContent=new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',timeZone:'Europe/Istanbul'})+' · '+(WHO()==='Berkay'?'İyi çalışmalar Berkay Bey':'İyi çalışmalar Oğuzhan Bey');
 if(!DZ.data)$('dAgenda').innerHTML='<div class="empty">Yükleniyor…</div>';
 $('dRefresh').textContent='⏳';
 try{DZ.data=await dCall('__dash',{});DZ.at=Date.now();renderDash();}
 catch(e){if(String(e.message)==='pin'){document.body.classList.remove('dashOn');return;}if(!DZ.data)$('dAgenda').innerHTML='<div class="empty">Panel yüklenemedi: '+dEsc(e.message||e)+'</div>';}
 finally{$('dRefresh').textContent='🔄';}
}
function renderDash(){
 const d=DZ.data,k=d.kpi;
 $('dKpi').innerHTML=[['r',k.late,'Geciken iş','late'],['o',k.dueToday,'Bugün teslim','work'],['',k.open,'Açık iş','work'],['b',k.shoots,'Bugün çekim','agenda'],['r',d.businesses.filter(b=>dState(b)==='r').length,'7+ gün paylaşım yok','nopost']].map(x=>'<button class="kpi '+x[0]+'" data-go="'+x[3]+'" type="button"><b>'+x[1]+'</b><span>'+x[2]+'</span></button>').join('');
 // Agenda
 const now=Date.now();let nextDone=false;
 $('dAgenda').innerHTML='<h2>🗓️ Bugünün ajandası<small>'+d.agenda.length+' kalem</small></h2>'+(d.agenda.length?d.agenda.map(a=>{const t=Date.parse(a.at);let cls='';if(t<now-30*60e3)cls=' past';else if(!nextDone){cls=' next';nextDone=true;}return '<div class="ev'+cls+'"><time>'+dHM(a.at)+'</time><div class="t"><b>'+dEsc(a.title)+'</b><span>'+dEsc(a.sub)+'</span></div><span class="ic">'+(a.kind==='shoot'?'🎥':'⏰')+'</span></div>';}).join(''):'<div class="empty">Bugün çekim veya hatırlatma yok.</div>')
  +(d.dueToday.length?'<div class="sub"><h3>📅 Bugün teslim ('+d.dueToday.length+')</h3>'+d.dueToday.slice(0,8).map(t=>'<div class="li"><span class="d o">bugün</span><div>'+dEsc(t.title)+'<br><span>'+dEsc(t.biz)+' · '+dEsc(dName(t.who))+'</span></div></div>').join('')+(d.dueToday.length>8?'<div class="empty">+'+(d.dueToday.length-8)+' iş daha</div>':'')+'</div>':'');
 // Work and team
 const max=Math.max(1,...d.people.map(p=>p.late+p.soon+p.other));
 $('dWork').innerHTML='<h2>👥 İşler ve ekip<small>'+k.open+' açık iş</small></h2><div class="legend"><span><i style="background:#ff5d73"></i>Geciken</span><span><i style="background:#ffb454"></i>Bugün/yarın</span><span><i style="background:#4ade80"></i>Diğer</span></div>'
  +(d.people.length?d.people.map(p=>{const t=p.late+p.soon+p.other;return '<div class="pp"><span class="n" title="'+dEsc(p.name)+'">'+dEsc(dName(p.name))+'</span><div class="bar" style="width:'+Math.round(t/max*100)+'%"><i class="l" style="width:'+p.late/t*100+'%"></i><i class="t" style="width:'+p.soon/t*100+'%"></i><i class="o" style="width:'+p.other/t*100+'%"></i></div><span class="c">'+t+'</span></div>';}).join(''):'<div class="empty">Açık iş yok.</div>')
  +'<div class="sub" id="dLate"><h3>🔴 Gecikenler ('+d.late.length+')</h3>'+(d.late.length?d.late.map(l=>'<div class="li"><span class="d">'+dShortDate(l.due)+'</span><div>'+dEsc(l.title)+'<br><span>'+dEsc(l.biz)+' · '+dEsc(dName(l.who))+'</span></div></div>').join(''):'<div class="empty">Geciken iş yok 👏</div>')+'</div>';
 renderBiz();
}
function renderBiz(){
 const d=DZ.data,rank={r:0,y:1,g:2,n:3};
 let list=d.businesses.map(b=>({...b,st:dState(b)}));
 const F={all:['Tümü',()=>true],nopost:['Paylaşım yok',b=>b.st==='r'],work:['İşi olan',b=>b.open>0],late:['Geciken',b=>b.late>0]};
 const shown=list.filter(F[DZ.filter][1]).sort((a,b)=>rank[a.st]-rank[b.st]||a.name.localeCompare(b.name,'tr'));
 $('dBiz').innerHTML='<h2>🏢 Müşteriler<small>'+(d.igDay?'Instagram: '+dShortDate(d.igDay):'')+'</small></h2><div class="filt">'+Object.entries(F).map(([key,[label,fn]])=>'<button type="button" data-f="'+key+'" class="'+(DZ.filter===key?'on':'')+'">'+label+' '+list.filter(fn).length+'</button>').join('')+'</div>'
  +'<div class="biz">'+(shown.length?shown.map(b=>{const ig=b.ig;const pic=ig&&ig.pic?'<img src="'+dEsc(ig.pic)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<span class=ph>🏢</span>\'">':'<span class="ph">🏢</span>';
   const l1=b.ads?'Reklam/paylaşım takibi yok':ig?'📸 '+dAgo(ig.last)+' · '+dNum(ig.followers)+' takipçi':'Instagram bağlı değil';
   const l2=ig?(ig.d7!=null?'<span class="'+(ig.d7>=0?'up':'down')+'">'+(ig.d7>=0?'+':'')+ig.d7+'</span> bu hafta · ':'')+ig.posts30+' paylaşım / 30 gün':(b.owner?dName(b.owner):'');
   return '<button class="bz '+b.st+'" type="button" data-id="'+b.id+'"><span class="dot"></span>'+pic+'<div class="in"><b>'+dEsc(b.name)+'</b><span>'+l1+'</span><span>'+l2+'</span>'+(b.owner&&ig?'<span>👤 '+dEsc(dName(b.owner))+'</span>':'')+(b.late?'<span class="tg r">'+b.late+' geciken</span>':'')+(b.open?'<span class="tg">'+b.open+' açık iş</span>':'')+'</div></button>';}).join(''):'<div class="empty">Bu filtrede işletme yok.</div>')+'</div>';
}
function dTab(i){DZ.tab=i;document.querySelectorAll('#dTabs button').forEach((b,k)=>b.classList.toggle('on',k===i));['dAgenda','dWork','dBiz'].forEach((id,k)=>$(id).classList.toggle('show',k===i));}
async function openBiz(id){
 const b=DZ.data?.businesses.find(x=>String(x.id)===String(id));
 $('bizBox').innerHTML='<div class="empty">Yükleniyor…</div>';document.body.classList.add('bizOn');
 let r;try{r=await dCall('__biz',{id:Number(id)});}catch(e){$('bizBox').innerHTML='<div class="empty">Açılamadı: '+dEsc(e.message||e)+'</div>';return;}
 const ig=r.ig,media=ig?.media||[];
 const likes=media.map(m=>m.l).filter(x=>x!=null),avgL=likes.length?Math.round(likes.reduce((a,c)=>a+c,0)/likes.length):null;
 const p30=media.filter(m=>Date.now()-Date.parse(m.t)<30*86400e3).length;
 const h=r.history||[];let chart;
 if(h.length>=2){const v=h.map(x=>x.followers),mn=Math.min(...v),mx=Math.max(...v),W=600,H=90,pad=8;const pts=v.map((y,i)=>[pad+i*(W-2*pad)/(v.length-1),H-pad-(mx===mn?.5:(y-mn)/(mx-mn))*(H-2*pad)]);chart='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><polyline fill="none" stroke="#4ade80" stroke-width="2.5" vector-effect="non-scaling-stroke" points="'+pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')+'"/></svg><div class="empty">'+dShortDate(h[0].day)+': '+dNum(v[0])+' → '+dShortDate(h[h.length-1].day)+': '+dNum(v[v.length-1])+' ('+(v[v.length-1]-v[0]>=0?'+':'')+(v[v.length-1]-v[0])+')</div>';}
 else chart='<div class="note">Takipçi grafiği her sabah alınan kayıtlarla birkaç gün içinde oluşacak.</div>';
 const pic=ig?.pic?'<img src="'+dEsc(ig.pic)+'" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<span class=ph>🏢</span>\'">':'<span class="ph">🏢</span>';
 $('bizBox').innerHTML='<div class="bh">'+pic+'<div><h3>'+dEsc(r.name)+'</h3><p>'+(ig?'<a href="https://instagram.com/'+dEsc(ig.username)+'" target="_blank" rel="noopener">@'+dEsc(ig.username)+'</a> · ':'')+(r.owner?'👤 '+dEsc(dName(r.owner)):'')+'</p></div><button type="button" id="bizX" aria-label="Kapat">✕</button></div>'
  +(ig?'<div class="st"><div><b>'+dNum(ig.followers)+'</b><span>takipçi</span></div><div><b>'+dNum(ig.posts)+'</b><span>toplam paylaşım</span></div><div><b>'+p30+'</b><span>son 30 gün</span></div><div><b>'+dNum(avgL)+'</b><span>ort. beğeni</span></div></div>'
   +'<div class="sec">Takipçi</div>'+chart
   +'<div class="sec">Son paylaşımlar · '+dAgo(media.length?Math.max(...media.map(m=>Date.parse(m.t))):null)+'</div><div class="posts">'+media.slice(0,12).map(m=>'<a class="po" href="'+dEsc(m.u)+'" target="_blank" rel="noopener" title="'+dEsc(m.cap)+'">'+(m.img?'<img src="'+dEsc(m.img)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'')+(m.k==='VIDEO'?'<i>🎬</i>':m.k==='CAROUSEL_ALBUM'?'<i>🗂️</i>':'')+'<span><em>'+dShortDate(dDay(m.t))+'</em><em>❤ '+dNum(m.l)+' 💬 '+dNum(m.c)+'</em></span></a>').join('')+'</div>'
  :'<div class="note">Bu işletmenin Instagram hesabı panele bağlı değil.</div>')
  +'<div class="sec">Açık işler ('+r.tasks.length+')</div>'+(r.tasks.length?r.tasks.map(t=>'<div class="tk'+(t.late?' late':'')+'">'+dEsc(t.title)+'<small>'+dEsc(dName(t.who))+(t.due?' · teslim '+dShortDate(t.due):'')+(t.late?' · gecikti':'')+'</small></div>').join(''):'<div class="empty">Açık iş yok.</div>');
 $('bizX').onclick=()=>document.body.classList.remove('bizOn');
}
$('dKpi').onclick=e=>{const g=e.target.closest('[data-go]')?.dataset.go;if(!g)return;if(g==='nopost'){DZ.filter='nopost';renderBiz();dTab(2);$('dBiz').scrollIntoView({behavior:'smooth',block:'start'});}else if(g==='agenda')dTab(0),$('dAgenda').scrollIntoView({behavior:'smooth',block:'start'});else{dTab(1);(g==='late'?$('dLate'):$('dWork'))?.scrollIntoView({behavior:'smooth',block:'start'});}};
$('dTabs').onclick=e=>{const b=e.target.closest('button');if(b)dTab(Number(b.dataset.t));};
$('dBiz').onclick=e=>{const f=e.target.closest('[data-f]');if(f){DZ.filter=f.dataset.f;renderBiz();return;}const b=e.target.closest('[data-id]');if(b)openBiz(b.dataset.id);};
$('bizSheet').onclick=e=>{if(e.target.id==='bizSheet')document.body.classList.remove('bizOn');};
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('bizOn');});
$('dRefresh').onclick=()=>loadDash();
$('dChat').onclick=$('dashFab').onclick=()=>dashShow(false);
$('dashBtn').onclick=()=>dashShow(true);
setInterval(()=>{if(document.body.classList.contains('dashOn')&&!document.hidden)loadDash();},5*60e3);
if(store.get())dashShow(true);
</script>
</body>
</html>
