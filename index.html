<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eyşan</title>
<meta name="theme-color" content="#06110c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eyşan">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="eysan.jpg">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#06110c;--panel:#0d1c15;--panel2:#12261d;--line:#1d3a2c;--text:#ecfbf2;--muted:#86a897;--accent:#4ade80;--accent2:#4f8bff;--grad:linear-gradient(135deg,#4ade80 0%,#22c55e 100%);--accent-ink:#05210f;--warn:#ffb454;--err:#ff5d73;--ok:#4ade80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg)}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);background:radial-gradient(90% 45% at 50% -5%,rgba(74,222,128,.16),transparent 60%),linear-gradient(rgba(74,222,128,.045) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(74,222,128,.045) 1px,transparent 1px) 0 0/28px 28px,var(--bg);background-attachment:fixed;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 0 8px;position:relative}
header img{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 2px rgba(74,222,128,.55),0 0 18px rgba(74,222,128,.35)}
header .who{flex:1;min-width:0}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
#status{margin:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menuBtn{background:var(--panel);border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:12px;font-size:18px;line-height:1}
#menu{display:none;position:absolute;right:0;top:52px;z-index:5;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:180px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
#menu.open{display:block}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:10px 12px;border-radius:10px;font-size:15px}
#menu button:active{background:var(--line)}
#voice{display:none!important}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px 0 10px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#log:empty::before{content:"";width:96px;height:96px;border-radius:50%;background:url(eysan.jpg) center/cover;margin:auto auto 10px;box-shadow:0 0 0 3px rgba(74,222,128,.6),0 0 40px rgba(74,222,128,.45)}
#log:empty::after{content:var(--hello,"Size nasıl yardımcı olayım, Oğuzhan Bey?");text-align:center;color:var(--muted);margin:0 auto 18px;font-size:15px}
.msg{max-width:86%;padding:9px 13px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}
.eysan{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.you{background:var(--grad);color:#05210f;font-weight:500;align-self:flex-end;border-bottom-right-radius:6px}
.card{align-self:stretch;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.35);border-radius:16px;padding:12px 14px;white-space:pre-wrap;font-size:15px}
.card b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sys{align-self:center;color:var(--muted);font-size:12.5px;text-align:center;padding:2px 8px}
.sys.err{color:var(--err)}
.thumb{align-self:flex-end;max-width:60%;border-radius:14px;border:1px solid var(--line)}
#qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 0 10px}
#qa button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--panel);color:var(--text);border-radius:16px;padding:8px 4px;font-size:13px;font-weight:600}
#qa button span{font-size:20px;line-height:1}
#qa button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
body.chatting #qa{display:flex;overflow-x:auto;gap:6px;padding:0 0 8px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
body.chatting #qa::-webkit-scrollbar{display:none}
body.chatting #qa button{flex:0 0 auto;flex-direction:row;min-height:0;padding:7px 11px;border-radius:999px;font-size:13px;gap:5px}
body.chatting #qa button span{font-size:15px}
#bottom{display:flex;flex-direction:column;gap:8px;padding:0 0 10px}
#mode,#livebar{display:none;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px;font-size:14px}
#mode span{flex:1}
#mode button{background:none;border:0;color:var(--muted);font-size:18px;padding:0 6px}
#livebar{border-color:rgba(255,107,129,.45)}
#livebar .dot{width:9px;height:9px;border-radius:50%;background:var(--err);animation:blink 1.2s infinite}
#livebar .lt{flex:1;font-weight:600}
#timer{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
#liveStop{border:0;border-radius:10px;padding:7px 12px;background:var(--err);color:#fff;font-weight:700;font-size:13px}
body.live #livebar{display:flex}
@keyframes blink{50%{opacity:.25}}
#textbar{display:flex;gap:8px;align-items:center;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:5px}
#txt{flex:1;min-width:0;font-size:16px;padding:9px 6px;border:0;outline:0;background:transparent;color:var(--text)}
#photoBtn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;font-size:19px;cursor:pointer;flex:0 0 auto}
#mic{width:42px;height:42px;flex:0 0 auto;border-radius:50%;border:0;background:var(--panel2);color:var(--text);display:grid;place-items:center;cursor:pointer}
#mic svg{width:22px;height:22px}
#mic.live{background:var(--err);color:#fff;animation:pulse 1.6s infinite}
#mic.live.hold{background:var(--panel2);color:var(--text);animation:none;box-shadow:0 0 0 2px var(--err) inset}
#mic.busy{opacity:.55}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,129,.5)}70%{box-shadow:0 0 0 12px rgba(255,107,129,0)}100%{box-shadow:0 0 0 0 rgba(255,107,129,0)}}
#send{width:42px;height:42px;flex:0 0 auto;border:0;border-radius:50%;background:var(--grad);color:#05210f;display:grid;place-items:center}
#send svg{width:20px;height:20px}
#orb{display:none;position:fixed;inset:0;z-index:20;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 26px);background:radial-gradient(60% 40% at 50% 42%,rgba(74,222,128,.16),transparent 70%),linear-gradient(rgba(74,222,128,.07) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(74,222,128,.07) 1px,transparent 1px) 0 0/28px 28px,#06110c}
body.orbOn:not(.orbHide) #orb{display:flex}
.pill{display:flex;padding:5px;border-radius:999px;border:1px solid rgba(124,240,168,.35);background:rgba(10,30,20,.75);box-shadow:0 0 28px rgba(74,222,128,.22)}
.pill span{padding:10px 26px;border-radius:999px;font-weight:700;font-size:17px;color:#5f8a73;transition:all .25s}
.pill span.on{background:#4ade80;color:#05210f;box-shadow:0 0 26px rgba(74,222,128,.6)}
#orbWrap{position:relative;flex:1;width:100%;min-height:0;display:grid;place-items:center}
#orbWrap::before{content:"";position:absolute;width:min(78vw,60vh);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(74,222,128,.45);box-shadow:0 0 30px rgba(74,222,128,.18),inset 0 0 30px rgba(74,222,128,.08)}
#orbCanvas{width:100%;height:100%;display:block}
#orbText{font-size:21px;font-weight:700;text-align:center;line-height:1.35;max-width:94%;min-height:2.7em;color:#fff;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#orbText.ai{color:#7cf0a8}
#orbStatus{color:#86a897;font-size:14px;margin:8px 0 18px;text-align:center}
.orbBtns{display:flex;gap:16px;align-items:center}
.orbBtns button{border-radius:999px;height:62px;min-width:62px;font-size:22px;background:rgba(124,240,168,.10);color:#e9fff1;border:1px solid rgba(124,240,168,.35);display:grid;place-items:center}
.orbBtns svg{width:26px;height:26px}
#orbMic.on{background:#4ade80;color:#05210f;animation:orbp 1.6s infinite}
#orbEnd{background:#ff5d73;border-color:#ff5d73;font-size:16px;font-weight:700;padding:0 28px}
@keyframes orbp{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}70%{box-shadow:0 0 0 18px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
#orbBack{position:absolute;left:14px;top:calc(env(safe-area-inset-top) + 14px);width:46px;height:46px;border-radius:14px;border:1px solid rgba(124,240,168,.35);background:rgba(10,30,20,.75);color:#e9fff1;font-size:30px;line-height:1;z-index:2;display:grid;place-items:center;padding:0 0 4px}
#pinbox{display:none;flex-direction:column;gap:12px;align-items:center;margin:auto 0;padding:24px 0}
#pinbox p{color:var(--muted);margin:0}
#pinbox input{font-size:24px;letter-spacing:6px;text-align:center;width:210px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
#pinbox button{font-size:16px;padding:12px 32px;border-radius:14px;border:0;background:var(--grad);color:#fff;font-weight:700}
#dash{display:none;position:fixed;inset:0;z-index:14;overflow-y:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(90% 40% at 50% -5%,rgba(74,222,128,.14),transparent 60%),linear-gradient(rgba(74,222,128,.04) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(74,222,128,.04) 1px,transparent 1px) 0 0/28px 28px,var(--bg)}
body.dashOn #dash{display:block}
#dash .dw{max-width:1280px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 96px)}
#dash .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
#dash .top img{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 2px rgba(74,222,128,.55)}
#dash .top h1{margin:0;font-size:19px}#dash .top p{margin:0;color:var(--muted);font-size:13px}
#dash .sp{flex:1}
#dash .chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:8px 12px;font-size:13.5px;cursor:pointer}
#dash .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
#dash .kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 16px;position:relative;overflow:hidden;text-align:left;color:var(--text);font:inherit;cursor:pointer}
#dash .kpi b{font-size:28px;display:block;line-height:1.1}#dash .kpi span{color:var(--muted);font-size:12.5px}
#dash .kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#4ade80}
#dash .kpi.r::after{background:#ff5d73}#dash .kpi.o::after{background:#ffb454}#dash .kpi.b::after{background:#4f8bff}
#dash .kpi.r b{color:#ff8a9a}#dash .kpi.o b{color:#ffc77a}
#dash .grid{display:grid;grid-template-columns:1fr 1.2fr 1.5fr;gap:14px;align-items:start}
#dash .dcard{background:rgba(13,28,21,.92);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
#dash .dcard h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
#dash .dcard h2 small{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px}
#dash .ev{display:flex;gap:12px;padding:9px 6px;border-top:1px solid #16301f}
#dash .ev:first-of-type{border-top:0}
#dash .ev time{width:46px;flex:0 0 auto;color:#7cf0a8;font-weight:700;font-variant-numeric:tabular-nums}
#dash .ev .t{min-width:0}#dash .ev .t b{display:block;font-size:14px;font-weight:600}#dash .ev .t span{color:var(--muted);font-size:12.5px}
#dash .ev .ic{margin-left:auto;font-size:16px}
#dash .ev.past{opacity:.5}
#dash .ev.next{background:linear-gradient(90deg,rgba(74,222,128,.13),transparent);border-radius:10px}
#dash .ev.next time{color:#fff}
#dash .empty{color:var(--muted);font-size:13.5px;padding:6px 2px}
#dash .pp{display:grid;grid-template-columns:96px 1fr 30px;align-items:center;gap:10px;padding:6px 0}
#dash .pp .n{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#dash .pp .c{text-align:right;font-weight:700;font-size:13.5px}
#dash .bar{height:10px;border-radius:999px;background:#12261d;overflow:hidden;display:flex;min-width:8px}
#dash .bar i{display:block;height:100%}#dash .bar .l{background:#ff5d73}#dash .bar .t{background:#ffb454}#dash .bar .o{background:#4ade80}
#dash .legend{display:flex;gap:12px;color:var(--muted);font-size:11.5px;margin:2px 0 6px}#dash .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
#dash .sub{margin-top:10px;border-top:1px solid #16301f;padding-top:8px}
#dash .sub h3{font-size:13.5px;margin:0 0 4px}
#dash .li{display:flex;gap:8px;padding:6px 0;font-size:13.5px}#dash .li .d{color:#ff8a9a;font-weight:700;width:46px;flex:0 0 auto}#dash .li .d.o{color:#ffc77a}#dash .li span{color:var(--muted)}
#dash .filt{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
#dash .filt button{border:1px solid var(--line);background:#0f2219;color:var(--muted);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
#dash .filt button.on{background:#4ade80;color:#05210f;border-color:#4ade80;font-weight:700}
#dash .biz{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#dash .bz{background:#0f2219;border:1px solid var(--line);border-radius:14px;padding:10px 12px;position:relative;text-align:left;color:var(--text);font:inherit;cursor:pointer;display:flex;gap:10px;align-items:flex-start;min-width:0}
#dash .bz img,#dash .bz .ph{width:38px;height:38px;border-radius:50%;flex:0 0 auto;object-fit:cover;background:#12261d;display:grid;place-items:center;font-size:16px}
#dash .bz .in{min-width:0;flex:1}
#dash .bz b{font-size:13.5px;display:block;padding-right:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dash .bz span{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dash .bz .dot{position:absolute;top:12px;right:10px;width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
#dash .bz.y .dot{background:#ffb454;box-shadow:0 0 8px #ffb454}#dash .bz.r .dot{background:#ff5d73;box-shadow:0 0 8px #ff5d73}#dash .bz.n .dot{background:#4b5f55;box-shadow:none}
#dash .bz.r{border-color:rgba(255,93,115,.4)}
#dash .tg{display:inline-block!important;margin:5px 4px 0 0;font-size:11px!important;background:#12261d;border-radius:999px;padding:1px 8px;color:#cfeedd!important}
#dash .tg.r{background:rgba(255,93,115,.18);color:#ff9aa8!important}
#dash .up{color:#7cf0a8}#dash .down{color:#ff8a9a}
#dash .tabs{display:none}
#dashFab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:15;display:none;align-items:center;gap:10px;background:linear-gradient(135deg,#4ade80,#22c55e);color:#05210f;border:0;border-radius:999px;padding:8px 18px 8px 8px;font-weight:800;font-size:15px;box-shadow:0 10px 30px rgba(74,222,128,.35);cursor:pointer}
body.dashOn #dashFab{display:flex}
#dashFab img{width:36px;height:36px;border-radius:50%}
#dashBtn{background:var(--panel);border:1px solid var(--line);color:var(--text);height:36px;border-radius:12px;font-size:14px;padding:0 10px;margin-left:auto}
#bizSheet{display:none;position:fixed;inset:0;z-index:16;background:rgba(0,0,0,.6);align-items:flex-end;justify-content:center}
body.bizOn #bizSheet{display:flex}
#bizSheet .bx{background:var(--bg);width:100%;max-width:760px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;border-top:1px solid rgba(74,222,128,.35);padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
#bizSheet .bh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
#bizSheet .bh img,#bizSheet .bh .ph{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#12261d;display:grid;place-items:center;font-size:24px}
#bizSheet .bh h3{margin:0;font-size:18px}#bizSheet .bh p{margin:2px 0 0;color:var(--muted);font-size:13px}#bizSheet .bh a{color:var(--accent)}
#bizSheet .bh button{margin-left:auto;background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer}
#bizSheet .st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
#bizSheet .st div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
#bizSheet .st b{display:block;font-size:18px}#bizSheet .st span{color:var(--muted);font-size:11.5px}
#bizSheet .sec{margin:14px 0 6px;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
#bizSheet svg{width:100%;height:90px;display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px}
#bizSheet .note{color:var(--muted);font-size:13px;background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
#bizSheet .posts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#bizSheet .po{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#12261d;display:block}
#bizSheet .po img{width:100%;height:100%;object-fit:cover;display:block}
#bizSheet .po span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));display:flex;justify-content:space-between}
#bizSheet .po i{position:absolute;top:4px;right:6px;font-style:normal;font-size:12px}
#bizSheet .tk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:6px;font-size:14px}
#bizSheet .tk small{display:block;color:var(--muted);font-size:12px}
#bizSheet .tk.late{border-color:rgba(255,93,115,.5)}
@media (max-width:900px){
 #dash .dw{padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 96px)}
 #dash .kpis{grid-template-columns:repeat(3,1fr);gap:8px}
 #dash .kpi{padding:9px 10px 9px 13px;border-radius:14px}#dash .kpi b{font-size:22px}#dash .kpi span{font-size:11.5px}
 #dash .tabs{display:flex;gap:6px;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;position:sticky;top:0;z-index:2}
 #dash .tabs button{flex:1;border:0;background:none;color:var(--muted);padding:9px 0;border-radius:10px;font-weight:700;font-size:13.5px}
 #dash .tabs button.on{background:#4ade80;color:#05210f}
 #dash .grid{grid-template-columns:1fr}
 #dash .grid>.dcard:not(.show){display:none}
 #dash .top .chip.hm{display:none}
 #bizSheet .posts{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:420px){#dash .biz{grid-template-columns:1fr}#bizSheet .st{grid-template-columns:repeat(2,1fr)}}

#dash .seg{margin-left:auto;display:flex;background:#0f2219;border:1px solid var(--line);border-radius:10px;padding:2px}
#dash .seg button{border:0;background:none;color:var(--muted);font-size:12px;padding:4px 10px;border-radius:8px;cursor:pointer;font-weight:600}
#dash .seg button.on{background:#4ade80;color:#05210f}
#dash .wd{margin:12px 0 2px;font-size:12.5px;color:#7cf0a8;font-weight:700;text-transform:capitalize}
#dash .pp{cursor:pointer;border-radius:8px}#dash .pp:hover .n{color:#7cf0a8}
#dash .h3s{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:600}
#dash .topw{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
#dash .tp{flex:0 0 112px;text-decoration:none;color:var(--text)}
#dash .tp .im{position:relative;width:112px;height:112px;border-radius:12px;overflow:hidden;background:#12261d;display:block}
#dash .tp img{width:100%;height:100%;object-fit:cover;display:block}

<script>
const API='https://vxxybonajctticjoyqdi.supabase.co/functions/v1/tablo-orders/';

const log=$('log'),statusEl=$('status'),mic=$('mic'),timerEl=$('timer');
let pc=null,dc=null,stream=null,token=null,endAt=0,tick=null,busy=false,micOn=false,pendingText=null,pendingImage=null,sessionId=null,startedAt=0;
const store={get(){try{return localStorage.getItem('eysan_pin')}catch{return null}},set(v){try{localStorage.setItem('eysan_pin',v)}catch{}},del(){try{localStorage.removeItem('eysan_pin')}catch{}}};
function addRaw(cls,text){const d=document.createElement('div');d.className=cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}

voiceSel.onchange=()=>{try{localStorage.setItem('eysan_voice',voiceSel.value)}catch{};if(pc){stop('Ses değişti, yeni sesle konuşmak için mikrofona dokunun.');}};
mic.onclick=async()=>{if(busy)return;if(conv){muteMic(!micMuted);return;}if(pc&&micOn){stop();return;}if(pc)stop();await start(true);};

function shrink(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,768/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',0.72));};img.onerror=rej;img.src=URL.createObjectURL(file);});}

async function onEvent(ev){
 switch(ev.type){
  case 'input_audio_buffer.speech_started':setStatus('Dinliyorum…');break;
  case 'output_audio_buffer.started':setStatus('Eyşan konuşuyor…');break;
  case 'output_audio_buffer.stopped':setStatus('Dinliyorum…');break;
  case 'conversation.item.input_audio_transcription.completed':if(ev.transcript){add('msg you',ev.transcript.trim());logTurn('user',ev.transcript.trim());}break;
  case 'response.output_audio_transcript.done':case 'response.audio_transcript.done':if(ev.transcript){add('msg eysan',ev.transcript.trim());logTurn('assistant',ev.transcript.trim());}break;
  case 'response.done':{
   const calls=(ev.response?.output||[]).filter(o=>o.type==='function_call');
   if(!calls.length)break;
   for(const c of calls){
    add('sys','🔧 '+(LABELS[c.name]||c.name)+'…');
    let args={};try{args=JSON.parse(c.arguments||'{}');}catch{}
    let result;
    try{
     const r=await fetch(API+'voice-tool',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,name:c.name,args})});
     result=await r.json();
     if(r.status===401){stop('Oturum süresi doldu, yeniden başlatın.');return;}
    }catch(e){result={hata:'Panele ulaşılamadı: '+String(e.message||e)};}
    if(result.onizleme)card(result.onizleme);
    if(c.name==='onayla'&&result.sonuc)add('sys',result.sonuc);
    send({type:'conversation.item.create',item:{type:'function_call_output',call_id:c.call_id,output:JSON.stringify(result)}});
   }
   send({type:'response.create'});
   break;}
  case 'error':add('sys err',ev.error?.message||'Bir hata oldu');break;
 }
}

const ORB={raf:0,pts:[],t:0,v:0};
function orbInit(){if(ORB.pts.length)return;const N=560;for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),th=i*2.399963;ORB.pts.push([Math.cos(th)*r,y,Math.sin(th)*r,Math.random()<.13]);}}
function orbLoop(){const c=$('orbCanvas');const g=c.getContext('2d');const dpr=window.devicePixelRatio||1;const w=c.clientWidth,h=c.clientHeight;if(!w||!h){ORB.raf=requestAnimationFrame(orbLoop);return;}if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);}g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
 let vol=0;try{if(conv)vol=agentTalking?conv.getOutputVolume():(micMuted?0:conv.getInputVolume());}catch{}
 ORB.v=ORB.v*.82+Math.min(1,vol*3)*.18;ORB.t+=.005+ORB.v*.02;
 const R=Math.min(w,h)*.34*(1+ORB.v*.16),cx=w/2,cy=h/2,ca=Math.cos(ORB.t),sa=Math.sin(ORB.t),cb=Math.cos(.4),sb=Math.sin(.4);
 for(const [x,y,z,b] of ORB.pts){let X=x*ca+z*sa,Z=-x*sa+z*ca;const Y=y*cb-Z*sb;Z=y*sb+Z*cb;const n=1+ORB.v*.22*Math.sin(ORB.t*7+x*5+y*6)+.015*Math.sin(ORB.t*2+y*4);const d=(Z+1)/2;g.globalAlpha=.18+d*.82;g.fillStyle=b?'#4f8bff':'#7cf0a8';g.beginPath();g.arc(cx+X*R*n,cy+Y*R*n,.7+d*2.8*(1+ORB.v*.7),0,6.2832);g.fill();}
 g.globalAlpha=1;ORB.raf=requestAnimationFrame(orbLoop);}

const dFold=s=>String(s||'').toLocaleLowerCase('tr-TR').replace(/[çğıöşü]/g,c=>({'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u'}[c])).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function ekranFind(list,name,key){
 key=key||'name';const q=dFold(name);if(!q)return null;let best=null,score=0;
 for(const x of list||[]){const n=dFold(x[key]);const ns=n.replace(/ /g,''),qs=q.replace(/ /g,'');const s=n===q?100:n.startsWith(q)?80:n.includes(q)?60:ns.includes(qs)?55:q.split(' ').filter(w=>w.length>2&&n.includes(w)).length*20;if(s>score){score=s;best=x;}}
 return score>=20?best:null;
}

const adMoney=n=>n<10?n.toFixed(2).replace('.',',')+' ₺':tl(n);
function adCost(a){
 const s=a.month?.spend||0,m=a.month?.results?.mesaj,t=a.month?.results?.tiklama;
 const ps=a.prev?.spend||0,pm=a.prev?.results?.mesaj,pt=a.prev?.results?.tiklama;
 let cur=null,old=null,lab='';
 if(m){cur=s/m;old=pm?ps/pm:null;lab='mesaj';}else if(t){cur=s/t;old=pt?ps/pt:null;lab='tıklama';}
 if(cur==null)return '';
 const worse=old&&cur>old*1.2,better=old&&cur<old*0.85;
 return ' · <span class="'+(worse?'cw':better?'cb':'')+'">'+lab+' başı '+adMoney(cur)+(old?' (geçen ay '+adMoney(old)+')':'')+'</span>';
}

 return '<div class="adbud"><div class="bar"><i class="'+(bad?'l':'o')+'" style="width:'+pct+'%"></i></div><span>Bütçe '+tl(s)+' / '+tl(a.budget)+' (%'+pct+')'+(s>=a.budget?' · bütçe doldu':bad?' · bu hızla ay sonu ~'+tl(proj):'')+'</span></div>';
}

const EMEL={open:null};
function emelGroups(){
 const l=(ADS.data?.accounts||[]).filter(a=>Number(a.business)===-2),G=[];
 for(const a of l){
  const nm=String(a.name||''),lab=/bodrum/i.test(nm)?'Bodrum':/fet(h)?i(h)?ye/i.test(nm)?'Fethiye':null;
  if(lab){G.push({key:a.id,name:lab,acc:a,camps:a.camps,daily:a.camps.reduce((s,c)=>s+(c.daily||0),0),spend:a.month?.spend||0,today:a.today||0,results:a.month?.results||{},reach:a.month?.reach||0});continue;}
  // Main account: split active campaigns by name into massage vs beauty.
  const isM=c=>/masaj|massage|spa/i.test(c.name),mas=a.camps.filter(isM),guz=a.camps.filter(c=>!isM(c));
  const part=(k,n,cs)=>{const r={};for(const c of cs)for(const [x,v] of Object.entries(c.results||{}))r[x]=(r[x]||0)+v;return {key:a.id+k,name:n,acc:a,camps:cs,spend:cs.reduce((s,c)=>s+(c.spend||0),0),today:cs.reduce((s,c)=>s+(c.today||0),0),daily:cs.reduce((s,c)=>s+(c.daily||0),0),results:r};};
  G.push(part('g','Güzellik',guz),part('m','Muğla Masaj',mas));
  const rest=(a.month?.spend||0)-a.camps.reduce((s,c)=>s+(c.spend||0),0);
  if(rest>1)G.push({key:a.id+'r',name:'Ana hesap · biten kampanyalar',acc:a,camps:[],spend:rest,today:null,results:{},note:'Bu ay harcayıp şu an aktif olmayan kampanyalar.'});
 }
 for(const n of ['Güzellik','Muğla Masaj','Bodrum','Fethiye'])if(!G.some(g=>g.name===n))G.push({key:'x'+n,name:n,missing:true,camps:[],spend:0,results:{}});
 return {l,G};
}

 const box=$('dAds');if(!box||!ADS.data)return;
 const old=$('emelSub');if(old)old.remove();
 const {l,G}=emelGroups(),sum=l.reduce((s,a)=>s+(a.month?.spend||0),0),today=l.reduce((s,a)=>s+(a.today||0),0);
 const warn=l.filter(a=>AD_ST[a.status]);
 const row=g=>{
  if(g.missing)return '<div class="ada"><div class="adh"><div class="adn"><b>Emel Hazır · '+dEsc(g.name)+'</b><span>reklam hesabı henüz bağlı değil</span></div><div class="ads"><b>—</b></div></div></div>';
  const on=EMEL.open===g.key;
  return '<div class="ada'+(on?' on':'')+'" data-emel="'+dEsc(g.key)+'"><div class="adh emh"><div class="adn"><b>Emel Hazır · '+dEsc(g.name)+'</b><span>'+(g.camps.length?g.camps.length+' aktif kampanya':g.note?'geçmiş harcama':'aktif kampanya yok')+(g.daily?' · günlük limit '+tl(g.daily):'')+(adRes(g.results)?' · '+adRes(g.results):'')+(AD_ST[g.acc.status]?' · <em>'+AD_ST[g.acc.status]+'</em>':'')+'</span></div><div class="ads"><b>'+tl(g.spend)+'</b><span>'+(g.today!=null?'bugün '+tl(g.today):'bu ay')+'</span></div></div>'
   +(on?'<div class="adb">'+(g.note?'<div class="adr">'+dEsc(g.note)+'</div>':'')+(g.reach?'<div class="adr">👥 '+dNum(g.reach)+' kişiye ulaştı</div>':'')
    +(g.camps.length?g.camps.map(c=>'<div class="tk">'+dEsc(c.name)+'<small>'+(c.daily?'günlük '+tl(c.daily):c.total?'toplam '+tl(c.total):'')+' · bugün '+tl(c.today||0)+' · bu ay '+tl(c.spend)+(adRes(c.results)?' · '+adRes(c.results):'')+(c.stop?' · bitiş '+dShortDate(dDay(c.stop)):'')+'</small></div>').join(''):(g.note?'':'<div class="empty">Şu an aktif kampanya yok.</div>'))
    +'<a class="mini" target="_blank" rel="noopener" href="https://adsmanager.facebook.com/adsmanager/manage/campaigns?act='+g.acc.id+'">Reklam Yöneticisi\'nde aç ↗</a></div>':'')+'</div>';
 };
 box.insertAdjacentHTML('beforeend','<div class="sub" id="emelSub"><h3>Emel Hazır · bu ay '+tl(sum)+' · bugün '+tl(today)+'</h3>'
  +warn.map(a=>'<div class="li"><span class="d">!</span><div>'+dEsc(a.name)+'<br><span>'+AD_ST[a.status]+'</span></div></div>').join('')
  +'<div class="adl">'+G.map(row).join('')+'</div></div>');
}
document.addEventListener('click',e=>{const h=e.target.closest('#emelSub .adh');if(!h)return;e.stopPropagation();const k=h.parentElement.dataset.emel;if(!k)return;EMEL.open=EMEL.open===k?null:k;renderAds();},true);
const _renderAdsBase=renderAds;
renderAds=function(){_renderAdsBase();renderEmel();};
if(ADS.data)renderAds();

// 📊 Ads analysis on the panel: weekly scorecard at the top of the ads card, a 30-day chart and a client report inside each opened account.
const AW={data:null,loading:false,trend:{},trendLoading:{}};
async function loadAdsWeek(fresh){
 if(AW.loading)return;AW.loading=true;
 try{AW.data=await dCall('__adsweek',{fresh:!!fresh});}catch(e){AW.err=String(e.message||e);}
 AW.loading=false;renderAds();
}
function awHtml(){
 const w=AW.data;
 if(!w)return '<div class="sub aw"><h3>📊 Haftalık karne</h3><div class="empty">'+(AW.err?'Okunamadı: '+dEsc(AW.err):'Son 7 gün hesaplanıyor…')+'</div></div>';
 const L=w.accounts,sc=L.reduce((t,a)=>t+a.cur.spend,0),so=L.reduce((t,a)=>t+a.old.spend,0),mc=L.reduce((t,a)=>t+(a.cur.results.mesaj||0),0),mo=L.reduce((t,a)=>t+(a.old.results.mesaj||0),0);
 const pct=(a,b)=>b?'<em class="'+(a>b?'up':'dn')+'">'+(a>=b?'+':'')+Math.round((a-b)/b*100)+'%</em>':'';
 const dm=s=>s.slice(8,10)+'.'+s.slice(5,7);
 const msg=L.filter(a=>a.unit&&a.unit.k==='mesaj'&&a.unit.n>=5);
 const best=msg.slice().sort((a,b)=>a.unit.c-b.unit.c).slice(0,3),worst=msg.slice().sort((a,b)=>b.unit.c-a.unit.c).slice(0,3).filter(a=>!best.includes(a));
 const up=L.filter(a=>a.costChange!=null&&a.costChange>=0.3).sort((a,b)=>b.costChange-a.costChange);
 const none=L.filter(a=>a.cur.spend>=300&&!a.unit);
 const li=(ic,a,txt)=>'<div class="awl"><span>'+ic+'</span><b>'+dEsc(a.name)+'</b><small>'+txt+'</small></div>';
 const col=(t,rows)=>rows.length?'<div class="awc"><h4>'+t+'</h4>'+rows.join('')+'</div>':'';
 return '<div class="sub aw"><h3>📊 Haftalık karne <small>'+dm(w.range.cur.since)+'–'+dm(w.range.cur.until)+' · geçen haftaya göre</small> <button type="button" class="mini" id="awRef">🔄</button></h3>'
  +'<div class="awk"><div><b>'+tl(sc)+'</b><span>harcama '+pct(sc,so)+'</span></div><div><b>'+dNum(mc)+'</b><span>mesaj '+pct(mc,mo)+'</span></div><div><b>'+(mc?adMoney(L.filter(a=>a.cur.results.mesaj).reduce((t,a)=>t+a.cur.spend,0)/mc):'—')+'</b><span>ort. mesaj başı</span></div></div>'
  +'<div class="awg">'
  +col('🏆 En verimli',best.map(a=>li('✓',a,'mesaj başı '+adMoney(a.unit.c)+' · '+a.unit.n+' mesaj')))
  +col('💸 En pahalı',worst.map(a=>li('!',a,'mesaj başı '+adMoney(a.unit.c)+' · '+a.unit.n+' mesaj')))
  +col('📈 Pahalananlar',up.map(a=>li('↑',a,a.unit.k+' başı '+adMoney(a.oldUnit.c)+' → '+adMoney(a.unit.c)+' (+'+Math.round(a.costChange*100)+'%)')))
  +col('⚠️ Harcama var, sonuç yok',none.map(a=>li('!',a,tl(a.cur.spend)+' harcandı')))
  +'</div></div>';
}
async function loadTrend(id){
 if(AW.trend[id]||AW.trendLoading[id])return;AW.trendLoading[id]=true;
 try{AW.trend[id]=(await dCall('__adtrend',{id})).days||[];}catch(e){AW.trend[id]={err:String(e.message||e)};}
 AW.trendLoading[id]=false;if(ADS.open===id)renderAds();
}
function trendSvg(days){
 if(days.err)return '<div class="empty">Grafik okunamadı: '+dEsc(days.err)+'</div>';
 if(!days.length)return '<div class="empty">Son 30 günde harcama yok.</div>';
 const W=300,H=70,n=days.length,bw=W/n,ms=Math.max(...days.map(d=>d.spend),1),key=days.some(d=>d.mesaj)?'mesaj':days.some(d=>d.form)?'form':'tiklama',mr=Math.max(...days.map(d=>d[key]||0),1);
 const bars=days.map((d,i)=>{const h=Math.max(1,d.spend/ms*(H-6));return '<rect x="'+(i*bw+1).toFixed(1)+'" y="'+(H-h).toFixed(1)+'" width="'+Math.max(1,bw-2).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="1.5"><title>'+dShortDate(d.day)+': '+tl(d.spend)+(d[key]?' · '+d[key]+' '+(key==='tiklama'?'tıklama':key):'')+'</title></rect>';}).join('');
 const pts=days.map((d,i)=>(i*bw+bw/2).toFixed(1)+','+(H-((d[key]||0)/mr)*(H-6)).toFixed(1)).join(' ');
 const tot=days.reduce((t,d)=>t+d.spend,0),res=days.reduce((t,d)=>t+(d[key]||0),0);
 return '<div class="atr"><div class="atl"><span><i class="sp"></i>günlük harcama</span><span><i class="rs"></i>'+(key==='tiklama'?'tıklama':key)+'</span><b>30 gün: '+tl(tot)+(res?' · '+dNum(res)+' '+(key==='tiklama'?'tıklama':key):'')+'</b></div><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><g class="b">'+bars+'</g><polyline points="'+pts+'"/></svg><div class="atx"><span>'+dShortDate(days[0].day)+'</span><span>'+dShortDate(days[n-1].day)+'</span></div></div>';
}
function clientReport(a){
 const bn=DZ.data?.businesses.find(b=>Number(b.id)===Number(a.business))?.name||a.name,m=a.month||{spend:0,reach:0,results:{}},r=m.results||{},p=a.prev;
 const mon=new Date().toLocaleDateString('tr-TR',{month:'long'});
 const t=['📣 '+bn+' · '+mon+' reklam özeti','','💸 Harcama: '+tl(m.spend)];
 if(m.reach)t.push('👥 Ulaşılan kişi: '+dNum(m.reach));
 if(r.mesaj)t.push('💬 Gelen mesaj: '+dNum(r.mesaj)+' (mesaj başı '+adMoney(m.spend/r.mesaj)+')');
 if(r.form)t.push('📝 Doldurulan form: '+dNum(r.form));
 if(r.tiklama)t.push('🔗 Tıklama: '+dNum(r.tiklama));
 if(p&&p.spend)t.push('','📊 Geçen ay: '+tl(p.spend)+(p.results?.mesaj?' · '+dNum(p.results.mesaj)+' mesaj':''));
 if(a.camps.length)t.push('','Yayındaki reklamlar:',...a.camps.map(c=>'• '+c.name));
 t.push('','Muğla Dijital Medya');return t.join('\n');
}
const _renderAdsAW=renderAds;
renderAds=function(){
 _renderAdsAW();const box=$('dAds');if(!box||!ADS.data)return;
 const k=box.querySelector('.adk');if(k)k.insertAdjacentHTML('afterend',awHtml());
 const r=$('awRef');if(r)r.onclick=e=>{e.stopPropagation();AW.data=null;renderAds();loadAdsWeek(true);};
 if(!AW.data&&!AW.loading&&!AW.err)loadAdsWeek();
 const on=ADS.open&&box.querySelector('.ada.on[data-acc="'+ADS.open+'"] .adb');
 if(on){const id=ADS.open;
  on.insertAdjacentHTML('afterbegin','<div class="atw">'+(AW.trend[id]?trendSvg(AW.trend[id]):'<div class="empty">Son 30 gün grafiği yükleniyor…</div>')+'</div><button type="button" class="mini arp" data-rep="'+id+'">📋 Müşteriye rapor</button>');
  if(!AW.trend[id])loadTrend(id);}
};
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-rep]');if(!b)return;e.stopPropagation();
 const a=ADS.data.accounts.find(x=>x.id===b.dataset.rep);if(!a)return;const txt=clientReport(a);
 let ok=false;try{await navigator.clipboard.writeText(txt);ok=true;}catch(err){}
 const old=document.querySelector('.arpTxt');if(old)old.remove();
 b.insertAdjacentHTML('afterend','<div class="arpTxt"><textarea rows="9" readonly>'+dEsc(txt)+'</textarea><div>'+(ok?'✅ Kopyalandı · ':'')+'<a class="mini" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(txt)+'">WhatsApp ile gönder ↗</a></div></div>');
},true);
if(ADS.data)renderAds();

// Desktop layout: a jump bar under the KPIs to reach each section quickly (phones keep their tabs).
(function(){
 const k=$('dKpi');if(!k||$('dJump'))return;
 const items=[['dAgenda','📅 Ajanda'],['dWork','👥 İşler'],['dBiz','📸 Instagram · Müşteriler'],['dAds','📣 Reklamlar'],['emelSub','⭐ Emel Hazır']];
 k.insertAdjacentHTML('afterend','<nav class="jump" id="dJump">'+items.map(([id,t])=>'<button type="button" data-j="'+id+'">'+t+'</button>').join('')+'</nav>');
 $('dJump').addEventListener('click',e=>{const b=e.target.closest('[data-j]');if(!b)return;const t=$(b.dataset.j);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});});
})();
</script>
